<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/carischool%20favicon%2032x32.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0D9488">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CariSchool">
<link rel="apple-touch-icon" href="/carischool%20logo%20512x512.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tadika & Taska Berdekatan Anda — CariSchool</title>
<meta name="description" content="Cari tadika dan taska berdaftar berdekatan anda. Pilih kawasan anda dan lihat senarai sekolah dengan segera.">
<link rel="canonical" href="https://www.carischools.com/berdekatan.html">
<meta property="og:title" content="Tadika & Taska Berdekatan Anda — CariSchool">
<meta property="og:description" content="Pilih kawasan anda dan lihat senarai tadika/taska berdaftar berdekatan anda dengan segera.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.carischools.com/berdekatan.html">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--teal:#0D9488;--td:#0F766E;--tl:#14B8A6;--yellow:#FBBF24;--yl:#FDE68A;--cream:#FFFBF0;--dark:#1C1917;--gray:#78716C;--light:#F5F5F4;--border:#E7E5E4;--green:#16A34A;--red:#DC2626;--blue:#2563EB;--jkm:#B45309;--jkml:#FEF3C7;--jkmd:#92400E;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Nunito',sans-serif;background:var(--cream);color:var(--dark);}
nav{position:sticky;top:0;z-index:100;background:rgba(255,251,240,.97);backdrop-filter:blur(16px);border-bottom:2.5px solid var(--yl);padding:0 20px;height:60px;display:flex;align-items:center;justify-content:space-between;}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;}
.logo-text{font-family:'Playfair Display',serif;font-size:19px;font-weight:900;color:var(--teal);}
.logo-text span{color:var(--yellow);}
.back-btn{background:var(--light);border:2px solid var(--border);padding:7px 16px;border-radius:18px;font-weight:800;font-size:13px;cursor:pointer;font-family:'Nunito',sans-serif;text-decoration:none;color:var(--dark);}
.hero{background:linear-gradient(135deg,#0D9488,#0891B2);padding:48px 20px 70px;text-align:center;position:relative;overflow:hidden;}
.hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:50px;background:var(--cream);clip-path:ellipse(55% 100% at 50% 100%);}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700;margin-bottom:14px;}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(24px,4vw,38px);color:#fff;font-weight:900;line-height:1.2;margin-bottom:10px;}
.hero h1 span{color:var(--yellow);}
.hero p{color:rgba(255,255,255,.82);font-size:14px;max-width:480px;margin:0 auto;line-height:1.6;}
.container{max-width:560px;margin:0 auto;padding:0 20px 60px;}
.loading{text-align:center;padding:40px;color:var(--gray);font-weight:700;}
.empty{text-align:center;padding:60px 20px;color:var(--gray);}
.empty-icon{font-size:48px;margin-bottom:12px;}

.search-card{background:#fff;border-radius:20px;border:2px solid var(--border);padding:24px;margin-top:-40px;position:relative;z-index:2;box-shadow:4px 4px 0 var(--border);}
.fi{width:100%;padding:14px 16px;border:2px solid var(--border);border-radius:12px;font-family:'Nunito',sans-serif;font-size:16px;font-weight:700;outline:none;background:var(--light);transition:all .2s;color:var(--dark);}
.fi:focus{border-color:var(--teal);background:#fff;}
.town-list{margin-top:14px;max-height:340px;overflow-y:auto;}
.town-item{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-radius:12px;cursor:pointer;transition:background .15s;text-decoration:none;color:var(--dark);}
.town-item:hover{background:var(--light);}
.town-name{font-weight:800;font-size:14px;}
.town-count{font-size:11px;color:var(--gray);font-weight:700;background:var(--light);padding:3px 10px;border-radius:20px;}
.town-item:hover .town-count{background:#fff;}
.section-label{font-size:11px;font-weight:800;color:var(--gray);text-transform:uppercase;letter-spacing:.6px;margin:18px 0 8px;padding:0 4px;}
</style>
</head>
<body>

<nav>
  <a class="logo" href="/"><img src="/carischool%20logo%20400x400.png" alt="CariSchool" style="width:34px;height:34px;border-radius:50%;object-fit:cover;"><div class="logo-text">Cari<span>School</span></div></a>
  <div style="display:flex;gap:8px;align-items:center;">
    <button id="langBtn" onclick="toggleLang()" style="background:var(--light);border:2px solid var(--border);padding:6px 14px;border-radius:18px;font-weight:800;font-size:12px;cursor:pointer;font-family:'Nunito',sans-serif;">🇲🇾 BM</button>
    <a class="back-btn" href="/" id="backBtn">← Kembali</a>
  </div>
</nav>

<div class="hero">
  <div class="hero-badge" id="heroBadge">📍 Cari Berdekatan</div>
  <h1 id="heroTitle">Tadika & Taska <span>Berdekatan Anda</span></h1>
  <p id="heroSub">Di mana anda? Pilih kawasan untuk lihat senarai sekolah dengan segera.</p>
</div>

<div class="container">
  <div class="search-card">
    <input class="fi" id="townSearch" type="text" placeholder="Taip nama bandar... (cth: Shah Alam)" autocomplete="off" oninput="filterTowns()">
    <div id="townListContent"><div class="loading" id="loadingText">Memuatkan senarai kawasan...</div></div>
  </div>
</div>

<script>
const SB_URL = 'https://pwbuhlwxnnxvtbqehyvy.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3YnVobHd4bm54dnRicWVoeXZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNTc4MTIsImV4cCI6MjA5MzczMzgxMn0.jIPBjCIazqMw6F-luFEebNy_YV6V35f2-LlnN9SDGiQ';
const db = window.supabase.createClient(SB_URL, SB_KEY);

function esc(s){
  const d = document.createElement('div');
  d.textContent = s||'';
  return d.innerHTML;
}

let ALL_TOWNS = [];

// One small RPC call on load -- ~53 rows, not a per-keystroke query.
// get_kawasan_towns() is the shared source of truth also used by
// kawasan.html's related-towns list and mirrors api/sitemap.js's threshold
// (M23 fix: previously two separate hardcoded town lists existed).
async function loadTowns(){
  try {
    const { data, error } = await db.rpc('get_kawasan_towns', { min_schools: 50 });
    if (error) throw error;
    ALL_TOWNS = data || [];
    renderTowns(ALL_TOWNS);
  } catch(e){
    document.getElementById('townListContent').innerHTML =
      `<div class="empty"><div class="empty-icon">😕</div>${t('loadError')}</div>`;
    console.error(e);
  }
}

function renderTowns(towns){
  const box = document.getElementById('townListContent');
  if (!towns.length){
    box.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div>${t('noMatch')}</div>`;
    return;
  }
  // Map param is `tw`, NOT `t` -- `t` is the page-global translation helper
  // and shadowing it here silently breaks any t('key') call inside this map.
  box.innerHTML = `
    <div class="section-label">${t('sectionLabel')}</div>
    <div class="town-list">
      ${towns.map(tw => `
        <a class="town-item" href="/kawasan.html?bandar=${encodeURIComponent(tw.town)}">
          <span class="town-name">📍 ${esc(tw.town)}</span>
          <span class="town-count">${tw.school_count} ${lang_schoolWord()}</span>
        </a>
      `).join('')}
    </div>
  `;
}

function lang_schoolWord(){ return currentLang === 'ms' ? 'sekolah' : 'schools'; }

function filterTowns(){
  const q = document.getElementById('townSearch').value.trim().toLowerCase();
  if (!q){ renderTowns(ALL_TOWNS); return; }
  renderTowns(ALL_TOWNS.filter(t => t.town.toLowerCase().includes(q)));
}

// ── TRANSLATIONS ──
let currentLang = localStorage.getItem('cs_lang') || 'ms';
const TRANSLATIONS = {
  ms: {
    backBtn:'← Kembali',
    heroBadge:'📍 Cari Berdekatan',
    heroTitle:'Tadika & Taska <span>Berdekatan Anda</span>',
    heroSub:'Di mana anda? Pilih kawasan untuk lihat senarai sekolah dengan segera.',
    loadingText:'Memuatkan senarai kawasan...',
    loadError:'Ralat memuatkan senarai. Sila cuba semula.',
    noMatch:'Tiada kawasan sepadan. Cuba nama lain.',
    sectionLabel:'Pilih Kawasan Anda',
    searchPlaceholder:'Taip nama bandar... (cth: Shah Alam)',
  },
  en: {
    backBtn:'← Back',
    heroBadge:'📍 Find Nearby',
    heroTitle:'Tadika & Taska <span>Near You</span>',
    heroSub:'Where are you? Pick your area to see the school list instantly.',
    loadingText:'Loading area list...',
    loadError:'Error loading the list. Please try again.',
    noMatch:'No matching area. Try a different name.',
    sectionLabel:'Choose Your Area',
    searchPlaceholder:'Type a town name... (e.g. Shah Alam)',
  }
};
function t(key){ return TRANSLATIONS[currentLang][key] || TRANSLATIONS['ms'][key] || key; }
function toggleLang(){
  currentLang = currentLang === 'ms' ? 'en' : 'ms';
  localStorage.setItem('cs_lang', currentLang);
  applyTranslations();
  filterTowns(); // re-render list + counts in the new language
}
function applyTranslations(){
  const setText = (id,val)=>{ const el=document.getElementById(id); if(el) el.textContent=val; };
  const setHtml = (id,val)=>{ const el=document.getElementById(id); if(el) el.innerHTML=val; };
  const langBtn = document.getElementById('langBtn');
  // Site convention: the button shows the CURRENT language (state indicator),
  // matching jobs.html/statistik.html and the rest of the site.
  if(langBtn) langBtn.textContent = currentLang==='ms' ? '🇲🇾 BM' : '🇬🇧 EN';
  document.documentElement.lang = currentLang;
  setText('backBtn', t('backBtn'));
  setText('heroBadge', t('heroBadge'));
  setHtml('heroTitle', t('heroTitle'));
  setText('heroSub', t('heroSub'));
  setText('loadingText', t('loadingText'));
  const searchInput = document.getElementById('townSearch');
  if (searchInput) searchInput.placeholder = t('searchPlaceholder');
  document.title = currentLang==='ms'
    ? 'Tadika & Taska Berdekatan Anda — CariSchool'
    : 'Tadika & Taska Near You — CariSchool';
}
applyTranslations();
loadTowns();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(()=>{}));
}
</script>
</body>
</html>
