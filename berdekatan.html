// Trading name for display, registry name as fallback -- same expression
// school.html and state.html use, so a parent sees the same name here that
// they see on the profile they tap through to.
function dispName(s){ return (s && (s.commercial_name || s.name)) || ''; }
function esc(s){
  const d = document.createElement('div');
  d.textContent = s||'';
  return d.innerHTML;

let ALL_TOWNS = [];
let LAST_RESULTS = null; // re-rendered on language toggle if results view is active

// One small RPC call on load -- ~53 rows, not a per-keystroke query.
// get_kawasan_towns() is the shared source of truth also used by
// kawasan.html's related-towns list and mirrors api/sitemap.js's threshold
// (M23 fix: previously two separate hardcoded town lists existed).
async function loadTowns(){
  try {
    const { data, error } = await db.rpc('get_kawasan_towns', { min_schools: 50 });
    if (error) throw error;
    ALL_TOWNS = data || [];
    renderTowns(ALL_TOWNS);
  } catch(e){
    document.getElementById('townListContent').innerHTML =
      `<div class="empty"><div class="empty-icon">😕</div>${t('loadError')}</div>`;
    console.error(e);
  }
}

function renderTowns(towns){
  const box = document.getElementById('townListContent');
  if (!towns.length){
    box.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div>${t('noMatch')}</div>`;
    return;
  }
  // Map param is `tw`, NOT `t` -- `t` is the page-global translation helper
  // and shadowing it here silently breaks any t('key') call inside this map.
  box.innerHTML = `
    <div class="section-label">${t('sectionLabel')}</div>
    <div class="town-list">
      ${towns.map(tw => `
        <a class="town-item" href="/kawasan.html?bandar=${encodeURIComponent(tw.town)}">
          <span class="town-name">📍 ${esc(tw.town)}</span>
          <span class="town-count">${tw.school_count} ${lang_schoolWord()}</span>
        </a>
      `).join('')}
    </div>
  `;
}

function lang_schoolWord(){ return currentLang === 'ms' ? 'sekolah' : 'schools'; }

function filterTowns(){
  const q = document.getElementById('townSearch').value.trim().toLowerCase();
  if (!q){ renderTowns(ALL_TOWNS); return; }
  renderTowns(ALL_TOWNS.filter(t => t.town.toLowerCase().includes(q)));
}

// ── GPS-BASED NEAREST SCHOOLS (added 2026-07-21, once lat/lng coverage
// reached ~6,900 schools via the coordinate backfill). Genuinely new
// capability -- berdekatan.html previously only offered a town picker;
// this is the first place on the site real device geolocation drives a
// distance-sorted result set. Bounding-box pre-filter (roughly ±55km)
// keeps the query payload small; precise sorting/display distance is
// computed client-side via Haversine on that smaller candidate set. ──

function haversineKm(lat1, lon1, lat2, lon2){
  const R = 6371;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLon = (lon2-lon1) * Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function useMyLocation(){
  const btn = document.getElementById('locateBtn');
  const errBox = document.getElementById('locateError');
  errBox.innerHTML = '';

  if (!('geolocation' in navigator)){
    errBox.innerHTML = `<div class="locate-error">${t('geoUnsupported')}</div>`;
    return;
  }

  btn.disabled = true;
  document.getElementById('locateBtnText').textContent = t('locating');

  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      await loadNearbySchools(pos.coords.latitude, pos.coords.longitude);
      btn.disabled = false;
      document.getElementById('locateBtnText').textContent = t('locateBtn');
    },
    (err) => {
      btn.disabled = false;
      document.getElementById('locateBtnText').textContent = t('locateBtn');
      const msg = err.code === err.PERMISSION_DENIED ? t('geoDenied') : t('geoError');
      errBox.innerHTML = `<div class="locate-error">${msg}</div>`;
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
  );
}

// Postcode centroids, loaded once and cached for the session. postcode_reference
// holds ~911 Malaysian postcodes with lat/lng and was previously unused by any
// page. Only 59.6% of schools have real coordinates, so a coordinates-only
// nearby search silently hid ~40% of the schools actually near the parent --
// including entire towns. Joining on postcode recovers 4,304 of the 4,417
// missing ones (99% total coverage) with no API cost.
let PC_GEO = null;
async function loadPostcodeGeo(){
  if (PC_GEO) return PC_GEO;
  PC_GEO = {};
  try {
    let from = 0; const B = 1000;
    while (true) {
      const { data, error } = await db.from('postcode_reference')
        .select('postcode,lat,lng').not('lat','is',null).range(from, from + B - 1);
      if (error || !data || data.length === 0) break;
      data.forEach(r => { if (r.postcode) PC_GEO[String(r.postcode).trim()] = { lat: r.lat, lng: r.lng }; });
      if (data.length < B) break;
      from += B;
    }
  } catch(e){
    // Non-fatal: fall back to exact-coordinate results only rather than
    // failing the whole nearby search over a missing lookup table.
    console.warn('Postcode geo unavailable, exact coordinates only:', e);
  }
  return PC_GEO;
}

async function loadNearbySchools(userLat, userLng){
  const box = 0.5; // ~55km net; precise distance computed after, top 25 shown
  try {
    const pcGeo = await loadPostcodeGeo();

    // Two reads: schools that carry their own coordinates (exact), plus schools
    // in the postcodes that fall inside the same box (approximate). The second
    // query is skipped entirely if the lookup table failed to load.
    const nearbyPostcodes = Object.keys(pcGeo).filter(pc => {
      const g = pcGeo[pc];
      return g.lat >= userLat - box && g.lat <= userLat + box &&
             g.lng >= userLng - box && g.lng <= userLng + box;
    });

    const COLS = 'id,name,commercial_name,slug,town,district,state,category,jkm_registration_no,is_claimed,google_rating,lat,lng,postcode,opens_at,closes_at';
    const queries = [
      db.from('schools').select(COLS)
        .eq('is_active', true).eq('is_demo', false)
        .not('lat', 'is', null)
        .gte('lat', userLat - box).lte('lat', userLat + box)
        .gte('lng', userLng - box).lte('lng', userLng + box)
        .limit(500)
    ];
    if (nearbyPostcodes.length) {
      queries.push(
        db.from('schools').select(COLS)
          .eq('is_active', true).eq('is_demo', false)
          .is('lat', null)
          .in('postcode', nearbyPostcodes.slice(0, 200))
          .limit(500)
      );
    }

    const results = await Promise.all(queries);
    const err = results.find(r => r.error);
    if (err && !results.some(r => r.data && r.data.length)) throw err.error;

    const seen = new Set();
    const merged = [];
    results.forEach(r => (r.data || []).forEach(s => {
      if (seen.has(s.id)) return;
      seen.add(s.id);
      const approx = s.lat == null;
      const g = approx ? pcGeo[String(s.postcode || '').trim()] : { lat: s.lat, lng: s.lng };
      if (!g) return;
      merged.push({ ...s, approx, dist: haversineKm(userLat, userLng, g.lat, g.lng) });
    }));

    // Exact coordinates win ties at the same rounded distance -- an approximate
    // postcode-centroid hit should never outrank a school we can actually place.
    merged.sort((a, b) => (a.dist - b.dist) || (a.approx - b.approx));
    renderResults(merged.slice(0, 25));
  } catch(e){
    document.getElementById('locateError').innerHTML = `<div class="locate-error">${t('geoError')}</div>`;
    console.error(e);
  }
}

// Same helper and same reasoning as school.html's isOpenNow -- Malaysia is
// fixed UTC+8 (no DST), and the badge hides entirely on weekends because
// opens_at/closes_at is Monday-derived and most schools have no real
// weekend data yet (pre-2026-07-25 crawler truncated to Mon+Tue only).
function isOpenNow(opensAt, closesAt){
  if(!opensAt || !closesAt) return null;
  const now = new Date();
  const utcMs = now.getTime() + now.getTimezoneOffset()*60000;
  const myt = new Date(utcMs + 8*60*60000);
  const day = myt.getDay();
  if(day === 0 || day === 6) return null;
  const nowMin = myt.getHours()*60 + myt.getMinutes();
  const [oh,om] = opensAt.split(':').map(Number);
  const [ch,cm] = closesAt.split(':').map(Number);
  return nowMin >= (oh*60+om) && nowMin < (ch*60+cm);
}

function renderResults(schools){
  LAST_RESULTS = schools;
  document.getElementById('pickerView').style.display = 'none';
  document.getElementById('locateCard').style.display = 'none';
  const view = document.getElementById('resultsView');
  view.style.display = 'block';

  if (!schools.length){
    view.innerHTML = `
      <div class="empty"><div class="empty-icon">🔍</div>${t('noNearby')}</div>
      <a class="reset-link" href="#" onclick="resetView();return false;">${t('resetLink')}</a>`;
    return;
  }

  view.innerHTML = `
    <div class="section-label">${t('nearestLabel')}</div>
    ${schools.some(s => s.approx) ? `<div style="font-size:11px;color:var(--gray);font-weight:600;margin:-6px 0 10px;">${t('approxNote')}</div>` : ''}
    ${schools.map(s => {
      const url = s.slug ? `/school/${s.slug}` : `/school.html?id=${s.id}`;
      const catBadge = s.category === 'JKM'
        ? `<span class="badge-jkm">🧸 JKM</span>`
        : `<span class="badge-moe">✅ MOE</span>`;
      // Dual-licensed schools keep MOE styling plus the amber JKM chip.
      const dualBadge = (s.category !== 'JKM' && s.jkm_registration_no) ? `<span class="badge-jkm">🧸 JKM</span>` : '';
      const claimedBadge = s.is_claimed ? `<span class="badge-claimed">✓ ${lang_claimedWord()}</span>` : '';
      const ratingBadge = s.google_rating ? `<span>⭐ ${s.google_rating}</span>` : '';
      const openState = isOpenNow(s.opens_at, s.closes_at);
      const openBadge = openState === true ? `<span style="color:#166534;font-weight:800;">🟢 ${t('openNow')}</span>`
        : openState === false ? `<span style="color:var(--gray);">⚫ ${t('closedNow')}</span>` : '';
      const loc = s.town || s.district || '';
      // "~" marks a distance measured from the postcode centroid rather than the
      // school's own pin -- honest about precision instead of implying we know
      // exactly where an uncoordinated school sits.
      const distText = s.approx ? `~${s.dist.toFixed(1)} km` : `${s.dist.toFixed(1)} km`;
      return `
        <a class="result-card" href="${url}">
          <div class="result-top">
            <div class="result-name">${esc(dispName(s))}</div>
            <div class="result-dist"${s.approx ? ` title="${t('approxTitle')}"` : ''}>${distText}</div>
          </div>
          <div class="result-meta">${catBadge}${dualBadge}${claimedBadge}${ratingBadge}${openBadge}<span>📍 ${esc(loc)}</span></div>
        </a>`;
    }).join('')}
    <a class="reset-link" href="#" onclick="resetView();return false;">${t('resetLink')}</a>
  `;
}

function lang_claimedWord(){ return currentLang === 'ms' ? 'Disahkan' : 'Verified'; }

  LAST_RESULTS = null;
  document.getElementById('resultsView').style.display = 'none';
  document.getElementById('resultsView').innerHTML = '';
  document.getElementById('pickerView').style.display = 'block';
  document.getElementById('locateCard').style.display = 'block';
  document.getElementById('locateError').innerHTML = '';
}

function t(key){ return TRANSLATIONS[currentLang][key] || TRANSLATIONS['ms'][key] || key; }
function toggleLang(){
  currentLang = currentLang === 'ms' ? 'en' : 'ms';
  localStorage.setItem('cs_lang', currentLang);
  applyTranslations();
  if (LAST_RESULTS) { renderResults(LAST_RESULTS); } else { filterTowns(); }
}
function applyTranslations(){
  const setText = (id,val)=>{ const el=document.getElementById(id); if(el) el.textContent=val; };
  const setHtml = (id,val)=>{ const el=document.getElementById(id); if(el) el.innerHTML=val; };
  const langBtn = document.getElementById('langBtn');
  // Site convention: the button shows the CURRENT language (state indicator),
  // matching jobs.html/statistik.html and the rest of the site.
  if(langBtn) langBtn.textContent = currentLang==='ms' ? '🇲🇾 BM' : '🇬🇧 EN';
  document.documentElement.lang = currentLang;
  setText('backBtn', t('backBtn'));
  setText('heroBadge', t('heroBadge'));
  setHtml('heroTitle', t('heroTitle'));
  setText('heroSub', t('heroSub'));
  setText('loadingText', t('loadingText'));
  setText('locateBtnText', t('locateBtn'));
  setText('locateNote', t('locateNote'));
  setText('dividerText', t('dividerText'));
  const searchInput = document.getElementById('townSearch');
  if (searchInput) searchInput.placeholder = t('searchPlaceholder');
  document.title = currentLang==='ms'
    ? 'Tadika & Taska Berdekatan Anda — CariSchool'
    : 'Tadika & Taska Near You — CariSchool';
}
applyTranslations();
loadTowns();
