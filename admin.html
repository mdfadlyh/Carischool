<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — CariSchool</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--teal:#0D9488;--td:#0F766E;--yellow:#FBBF24;--dark:#1C1917;--gray:#78716C;--light:#F5F5F4;--border:#E7E5E4;--red:#EF4444;--green:#16A34A;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Nunito',sans-serif;background:var(--light);color:var(--dark);min-height:100vh;}

/* LOGIN */
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.login-box{background:#fff;border-radius:20px;padding:40px 32px;max-width:380px;width:100%;border:2px solid var(--border);box-shadow:4px 4px 0 var(--border);text-align:center;}
.login-logo{font-family:'Playfair Display',serif;font-size:28px;font-weight:900;color:var(--teal);margin-bottom:4px;}
.login-logo span{color:var(--yellow);}
.login-sub{font-size:13px;color:var(--gray);font-weight:600;margin-bottom:28px;}
.login-input{width:100%;padding:12px 16px;border:2px solid var(--border);border-radius:12px;font-size:15px;font-weight:700;font-family:'Nunito',sans-serif;outline:none;margin-bottom:12px;text-align:center;letter-spacing:3px;}
.login-input:focus{border-color:var(--teal);}
.login-btn{width:100%;background:var(--teal);color:#fff;border:none;padding:13px;border-radius:12px;font-weight:900;font-size:15px;cursor:pointer;font-family:'Nunito',sans-serif;box-shadow:3px 3px 0 var(--td);}
.login-err{color:var(--red);font-size:13px;font-weight:700;margin-top:8px;display:none;}

/* DASHBOARD */
#dashboard{display:none;padding:24px 20px;max-width:960px;margin:0 auto;}
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px;}
.top-logo{font-family:'Playfair Display',serif;font-size:22px;font-weight:900;color:var(--teal);}
.top-logo span{color:var(--yellow);}
.logout-btn{background:var(--light);border:2px solid var(--border);padding:7px 16px;border-radius:18px;font-weight:800;font-size:13px;cursor:pointer;font-family:'Nunito',sans-serif;}

/* TABS */
.tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:2px solid var(--border);padding-bottom:0;flex-wrap:wrap;}
.tab{padding:10px 20px;font-weight:800;font-size:14px;cursor:pointer;border-radius:12px 12px 0 0;border:2px solid transparent;border-bottom:none;margin-bottom:-2px;color:var(--gray);}
.tab.active{background:#fff;border-color:var(--border);color:var(--teal);}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:24px;}
.stat-box{background:#fff;border-radius:14px;border:2px solid var(--border);padding:16px;text-align:center;box-shadow:3px 3px 0 var(--border);}
.stat-n{font-family:'Playfair Display',serif;font-size:28px;font-weight:900;color:var(--teal);}
.stat-l{font-size:11px;color:var(--gray);font-weight:700;margin-top:3px;}

/* REVIEW CARDS */
.review-card{background:#fff;border-radius:16px;border:2px solid var(--border);padding:18px;margin-bottom:12px;box-shadow:3px 3px 0 var(--border);}
.rc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px;}
.rc-info{flex:1;}
.rc-name{font-weight:900;font-size:15px;}
.rc-meta{font-size:12px;color:var(--gray);font-weight:600;margin-top:2px;}
.rc-comment{font-size:14px;font-weight:600;line-height:1.6;color:var(--dark);background:var(--light);padding:10px 14px;border-radius:10px;margin-bottom:12px;}
.rc-actions{display:flex;gap:8px;flex-wrap:wrap;}
.btn{padding:7px 16px;border-radius:18px;font-weight:800;font-size:13px;cursor:pointer;font-family:'Nunito',sans-serif;border:none;transition:all .15s;}
.btn-approve{background:#DCFCE7;color:var(--green);}
.btn-approve:hover{background:var(--green);color:#fff;}
.btn-reject{background:#FEE2E2;color:var(--red);}
.btn-reject:hover{background:var(--red);color:#fff;}
.btn-delete{background:var(--light);color:var(--gray);border:2px solid var(--border);}
.badge{display:inline-block;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:800;}
.badge-pending{background:#FEF3C7;color:#92400E;}
.badge-approved{background:#DCFCE7;color:var(--green);}

.empty{text-align:center;padding:48px 20px;color:var(--gray);font-weight:700;}
.empty-icon{font-size:40px;margin-bottom:12px;}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;margin:40px auto;}
@keyframes spin{to{transform:rotate(360deg);}}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1C1917;color:#fff;padding:10px 22px;border-radius:18px;font-weight:800;font-size:14px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;}
.toast.show{opacity:1;}

/* FEE LINK TOOL */
.fee-search-bar{display:flex;gap:8px;margin-bottom:16px;}
.fee-search-bar input{flex:1;padding:11px 16px;border:2px solid var(--border);border-radius:12px;font-size:14px;font-weight:700;font-family:'Nunito',sans-serif;outline:none;}
.fee-search-bar input:focus{border-color:var(--teal);}
.fee-search-bar select{padding:11px 12px;border:2px solid var(--border);border-radius:12px;font-size:13px;font-weight:700;font-family:'Nunito',sans-serif;outline:none;background:#fff;}
.fee-card{background:#fff;border-radius:14px;border:2px solid var(--border);padding:14px 16px;margin-bottom:10px;box-shadow:3px 3px 0 var(--border);}
.fee-card-name{font-weight:900;font-size:14px;margin-bottom:2px;}
.fee-card-meta{font-size:11px;color:var(--gray);font-weight:600;margin-bottom:10px;}
.fee-input-row{display:flex;gap:8px;}
.fee-input-row input{flex:1;padding:9px 12px;border:2px solid var(--border);border-radius:10px;font-size:13px;font-family:'Nunito',sans-serif;outline:none;}
.fee-input-row input:focus{border-color:var(--teal);}
.fee-save-btn{background:var(--teal);color:#fff;border:none;padding:9px 16px;border-radius:10px;font-weight:800;font-size:12px;cursor:pointer;font-family:'Nunito',sans-serif;white-space:nowrap;}
.fee-status{font-size:11px;font-weight:700;margin-top:6px;}
.fee-status.has-link{color:var(--green);}
.fee-status.no-link{color:var(--gray);}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">Cari<span>School</span></div>
    <div class="login-sub">🔒 Admin Dashboard</div>
    <input type="password" id="pwdInput" class="login-input" placeholder="••••••••"
      onkeydown="if(event.key==='Enter')checkLogin()">
    <button class="login-btn" onclick="checkLogin()">Log Masuk →</button>
    <div class="login-err" id="loginErr">❌ Kata laluan salah</div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="top-bar">
    <div class="top-logo">Cari<span>School</span> <span style="font-size:14px;color:var(--gray);font-weight:700;">Admin</span></div>
    <button class="logout-btn" onclick="logout()">Log Keluar</button>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-box"><div class="stat-n" id="statClaims">–</div><div class="stat-l">Tuntutan Sekolah</div></div>
    <div class="stat-box"><div class="stat-n" id="statJobs">–</div><div class="stat-l">Jawatan Menunggu</div></div>
    <div class="stat-box"><div class="stat-n" id="statPremiumReq">–</div><div class="stat-l">Pohon Premium</div></div>
    <div class="stat-box"><div class="stat-n" id="statNewSchools">–</div><div class="stat-l">Sekolah Baharu</div></div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" id="tabClaims"   onclick="switchTab('claims')">🏫 Tuntutan Sekolah</div>
    <div class="tab"        id="tabFeeLinks" onclick="switchTab('feelinks')">💰 Pautan Yuran</div>
    <div class="tab"        id="tabJobs"     onclick="switchTab('jobs')">💼 Jawatan Kosong</div>
    <div class="tab"        id="tabNewSchools" onclick="switchTab('newschools')">🆕 Sekolah Baharu</div>
    <div class="tab"        id="tabWebsites" onclick="switchTab('websites')">🌐 Sekolah Berlaman Web</div>
    <div class="tab"        id="tabEvents"   onclick="switchTab('events')">📅 Hari Terbuka</div>
    <div class="tab"        id="tabFacebook" onclick="switchTab('facebook')">📱 Halaman Facebook</div>
    <div class="tab"        id="tabJkmReview" onclick="switchTab('jkmreview')">🧸 Semakan JKM</div>
    <div class="tab"        id="tabGallery"   onclick="switchTab('gallery')">🖼️ Galeri Sekolah</div>
  </div>

  <div id="reviewsList"><div class="spinner"></div></div>
</div>

<div class="toast" id="toast"></div>

<script>
const ADMIN_PASSWORD = 'hayden111';
const ADMIN_API_KEY = 'hayden111'; // must match the ADMIN_API_KEY env var set in Vercel
const SB_URL = 'https://pwbuhlwxnnxvtbqehyvy.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3YnVobHd4bm54dnRicWVoeXZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNTc4MTIsImV4cCI6MjA5MzczMzgxMn0.jIPBjCIazqMw6F-luFEebNy_YV6V35f2-LlnN9SDGiQ';
const db = window.supabase.createClient(SB_URL, SB_KEY);

let currentTab = 'claims';

// ── AUTH ──
function checkLogin() {
  const pwd = document.getElementById('pwdInput').value;
  if(pwd === ADMIN_PASSWORD) {
    sessionStorage.setItem('cs_admin', '1');
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadDashboard();
  } else {
    document.getElementById('loginErr').style.display = 'block';
    document.getElementById('pwdInput').value = '';
  }
}
function logout() {
  sessionStorage.removeItem('cs_admin');
  location.reload();
}

// Auto-login if session exists
if(sessionStorage.getItem('cs_admin') === '1') {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadDashboard();
}

// ── LOAD ──
async function loadDashboard() {
  await Promise.all([loadStats(), loadClaims()]);
}

async function loadStats() {
  const [{ count: claims }, { count: premiumReqs }, { count: newSchools }] = await Promise.all([
    db.from('schools').select('*', { count:'exact', head:true }).eq('claim_status','pending'),
    db.from('schools').select('*', { count:'exact', head:true }).eq('is_premium', false).not('premium_requested_at', 'is', null),
    db.from('new_school_submissions').select('*', { count:'exact', head:true }).eq('status','pending'),
  ]);
  document.getElementById('statClaims').textContent   = claims   || 0;
  document.getElementById('statPremiumReq').textContent = premiumReqs || 0;
  document.getElementById('statNewSchools').textContent = newSchools || 0;
  try {
    const res = await fetch('/api/manage-job-posting', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action:'adminList', adminKey: ADMIN_API_KEY })
    });
    const data = await res.json();
    const pendingCount = (data.jobs||[]).filter(j=>j.status==='pending').length;
    document.getElementById('statJobs').textContent = pendingCount;
  } catch(e){ document.getElementById('statJobs').textContent = '–'; }
}

// ── TABS ──
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tabClaims').classList.toggle('active',   tab === 'claims');
  document.getElementById('tabFeeLinks').classList.toggle('active', tab === 'feelinks');
  document.getElementById('tabJobs').classList.toggle('active', tab === 'jobs');
  document.getElementById('tabNewSchools').classList.toggle('active', tab === 'newschools');
  document.getElementById('tabWebsites').classList.toggle('active', tab === 'websites');
  document.getElementById('tabEvents').classList.toggle('active', tab === 'events');
  document.getElementById('tabFacebook').classList.toggle('active', tab === 'facebook');
  document.getElementById('tabJkmReview').classList.toggle('active', tab === 'jkmreview');
  document.getElementById('tabGallery').classList.toggle('active', tab === 'gallery');
  if(tab === 'claims') loadClaims();
  else if(tab === 'feelinks') loadFeeLinksTool();
  else if(tab === 'jobs') loadJobPostings();
  else if(tab === 'newschools') loadNewSchools();
  else if(tab === 'websites') loadWebsiteTool();
  else if(tab === 'events') loadEventsTool();
  else if(tab === 'facebook') loadFacebookTool();
  else if(tab === 'jkmreview') loadJkmReviewTool();
  else if(tab === 'gallery') loadGalleryModerationTool();
}

async function loadClaims() {
  document.getElementById('reviewsList').innerHTML = '<div class="spinner"></div>';

  const FOUNDING_LIMIT = 100;
  // Count schools that already claimed AND have premium, as a proxy for
  // "founding member" grants so far (auto-granted via this exact flow,
  // not premium bought/requested separately through approvePremiumRequest).
  const { count: foundingCount } = await db.from('schools')
    .select('*', { count: 'exact', head: true })
    .eq('is_claimed', true)
    .eq('is_premium', true);
  const foundingSpotsLeft = Math.max(0, FOUNDING_LIMIT - (foundingCount || 0));

  const { data: premiumReqs } = await db.from('schools')
    .select('id,name,district,town,state,school_code,category,jkm_registration_no,premium_requested_at')
    .eq('is_premium', false)
    .not('premium_requested_at', 'is', null)
    .order('premium_requested_at', { ascending: false });

  const { data: rawClaims, error } = await db.rpc('get_pending_claims');
  let data = null;
  if (!error && rawClaims) {
    const schoolIds = [...new Set(rawClaims.map(c => c.school_id).filter(Boolean))];
    const { data: schoolsData } = await db.from('schools').select('id,name,state,district,town,school_code,category,jkm_registration_no').in('id', schoolIds);
    const schoolMap = {};
    (schoolsData||[]).forEach(s => schoolMap[s.id] = s);
    data = rawClaims.map(c => ({ ...c, schools: schoolMap[c.school_id] || null }));
  }

  if (error) {
    document.getElementById('reviewsList').innerHTML = `<div class="empty">Ralat: ${error.message}</div>`;
    return;
  }

  const fmt = d => d ? new Date(d).toLocaleDateString('ms-MY',{day:'numeric',month:'long',year:'numeric'}) : '–';

  let html = `<div style="background:linear-gradient(135deg,#FFFBEB,#FEF3C7);border:2px solid #FDE68A;border-radius:12px;padding:12px 16px;margin-bottom:16px;text-align:center;">
    <div style="font-weight:900;font-size:13px;color:#92400E;">⭐ Sekolah Pengasas (Founding): ${foundingCount || 0} / ${FOUNDING_LIMIT}</div>
    <div style="font-size:11px;color:#78350F;font-weight:600;margin-top:2px;">${foundingSpotsLeft > 0 ? `${foundingSpotsLeft} tempat percuma lagi — kotak "Berikan Premium" akan ditanda automatik sehingga penuh` : 'Semua tempat pengasas telah diberikan — tanda manual untuk kekecualian'}</div>
  </div>`;

  if (premiumReqs && premiumReqs.length > 0) {
    html += `<h3 style="font-size:14px;font-weight:900;margin-bottom:10px;">⭐ Permintaan Naik Taraf Premium (${premiumReqs.length})</h3>`;
    html += premiumReqs.map(s => `
      <div class="review-card" id="pr-${s.id}">
        <div class="rc-head">
          <div class="rc-info">
            <div class="rc-name">${s.category==='JKM'?'🧸 ':''}${s.name}</div>
            <div class="rc-meta">📍 ${s.district||s.town||''}, ${s.state||''} · ${s.school_code||s.jkm_registration_no||''}</div>
            <div class="rc-meta">Dipohon: ${fmt(s.premium_requested_at)}</div>
          </div>
          <span class="badge badge-pending">⭐ Menunggu</span>
        </div>
        <div class="rc-actions">
          <button class="btn btn-approve" onclick="approvePremiumRequest('${s.id}')">✅ Luluskan Premium</button>
          <button class="btn btn-reject" onclick="dismissPremiumRequest('${s.id}')">✕ Tolak</button>
        </div>
      </div>`).join('');
    html += `<div style="margin:20px 0;border-top:2px solid var(--border);"></div>`;
  }

  if(!data || data.length === 0) {
    html += '<div class="empty"><div class="empty-icon">🎉</div><div>Tiada tuntutan baharu!</div></div>';
    document.getElementById('reviewsList').innerHTML = html;
    return;
  }

  html += data.map(s => `
    <div class="review-card" id="cl-${s.id}">
      <div class="rc-head">
        <div class="rc-info">
          <div class="rc-name">${s.schools?.category==='JKM'?'🧸 ':''}${s.schools?.name || '(sekolah tidak dijumpai)'}</div>
          <div class="rc-meta">📍 ${s.schools?.district||s.schools?.town||''}, ${s.schools?.state||''} · ${s.schools?.school_code||s.schools?.jkm_registration_no||''}</div>
          <div class="rc-meta">👤 ${s.contact_name||'–'} · 📱 ${s.contact_phone||'–'}</div>
          <div class="rc-meta">📞 ${s.phone||'–'} · 💬 ${s.whatsapp||'–'} · 📧 ${s.email||'–'}</div>
          <div class="rc-meta">Pelan: <strong>${s.plan === 'premium_interest' ? '⭐ Premium (Berminat)' : 'Percuma'}</strong> · Kod: <code>${s.claim_code||'–'}</code> · Dihantar: ${fmt(s.created_at)}</div>
          ${(s.fee_min||s.fee_max) ? `<div class="rc-meta">💰 Yuran dicadang: RM${s.fee_min||'?'} – RM${s.fee_max||'?'}</div>` : ''}
          ${s.fee_source_url ? `<div class="rc-meta">🔗 Pautan yuran: <a href="${s.fee_source_url}" target="_blank" rel="noopener">${s.fee_source_url}</a></div>` : ''}
          ${s.fee_document_url ? `<div class="rc-meta">📎 Dokumen yuran: <a href="${s.fee_document_url}" target="_blank" rel="noopener">Lihat fail</a></div>` : ''}
          <div class="rc-meta">📜 Sijil SSM/MOE: ${s.proof_document_url ? `<a href="${s.proof_document_url}" target="_blank" rel="noopener" style="color:var(--green);font-weight:800;">✓ Lihat sijil</a>` : '<span style="color:var(--red);font-weight:800;">⚠️ Tiada sijil dimuat naik</span>'}</div>
        </div>
        <span class="badge badge-pending">⏳ Menunggu</span>
      </div>
      ${s.website ? `<div class="rc-comment">🌐 ${s.website}</div>` : ''}
      ${s.description ? `<div class="rc-comment">📝 ${s.description}</div>` : ''}
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#92400E;background:#FEF3C7;padding:8px 12px;border-radius:10px;margin-bottom:10px;cursor:pointer;">
        <input type="checkbox" id="grantPremium-${s.id}" style="width:16px;height:16px;" ${foundingSpotsLeft > 0 ? 'checked' : ''}>
        ⭐ Berikan Premium Percuma (founding member) — ${foundingSpotsLeft > 0 ? `${foundingSpotsLeft} tempat lagi daripada ${FOUNDING_LIMIT}` : 'tiada tempat tersisa, tanda manual jika mahu beri juga'}
      </label>
      <div class="rc-actions">
        <button class="btn btn-approve" onclick="approveClaim('${s.id}','${s.school_id}')">✅ Luluskan</button>
        <button class="btn btn-reject"  onclick="rejectClaim('${s.id}','${s.school_id}')">❌ Tolak</button>
      </div>
    </div>`).join('');

  document.getElementById('reviewsList').innerHTML = html;
}

async function approvePremiumRequest(schoolId) {
  const { error } = await db.from('schools').update({ is_premium: true, premium_requested_at: null }).eq('id', schoolId);
  if (!error) { showToast('⭐ Premium diluluskan!'); loadStats(); loadClaims(); }
  else { showToast('❌ Ralat meluluskan'); }
}

async function dismissPremiumRequest(schoolId) {
  const { error } = await db.from('schools').update({ premium_requested_at: null }).eq('id', schoolId);
  if (!error) { showToast('Permintaan ditolak'); loadStats(); loadClaims(); }
  else { showToast('❌ Ralat'); }
}

// ── NEW SCHOOL SUBMISSIONS TOOL ──
function slugify(s) {
  return (s||'').toLowerCase().trim()
    .replace(/[^a-z0-9]+/g,'-')
    .replace(/(^-|-$)/g,'');
}

async function loadNewSchools() {
  document.getElementById('reviewsList').innerHTML = '<div class="spinner"></div>';
  try {
    const { data, error } = await db.from('new_school_submissions')
      .select('*')
      .eq('status', 'pending')
      .order('created_at', { ascending: false });
    if (error) throw error;

    if (!data || data.length === 0) {
      document.getElementById('reviewsList').innerHTML = '<div class="empty"><div class="empty-icon">🎉</div><div>Tiada permohonan sekolah baharu.</div></div>';
      return;
    }

    const fmt = d => d ? new Date(d).toLocaleDateString('ms-MY',{day:'numeric',month:'long',year:'numeric'}) : '–';

    const isJKMSubmission = (s) => s.agency === 'JKM' || s.category === 'JKM';
    document.getElementById('reviewsList').innerHTML = data.map(s => {
      const jkm = isJKMSubmission(s);
      const regCode = jkm
        ? (s.jkm_registration_no ? `No. JKM: <code>${s.jkm_registration_no}</code>` : '')
        : (s.proposed_school_code ? `Kod cadangan: <code>${s.proposed_school_code}</code>` : '');
      return `
      <div class="review-card" id="ns-${s.id}">
        <div class="rc-head">
          <div class="rc-info">
            <div class="rc-name">${jkm?'🧸':'🆕'} ${s.school_name}</div>
            <div class="rc-meta">📍 ${s.address||''}, ${s.postcode||''} ${s.district||''}, ${s.state||''}</div>
            <div class="rc-meta">🏷️ ${s.category||'Tidak dinyatakan'} · ${s.agency||'KPM'} ${regCode?'· '+regCode:''}</div>
            <div class="rc-meta">👤 ${s.contact_name||'–'} · 📞 ${s.phone||'–'} · 💬 ${s.whatsapp||'–'} · 📧 ${s.email||'–'}</div>

async function approveNewSchool(submissionId) {
  const { data: sub, error: fetchErr } = await db.from('new_school_submissions').select('*').eq('id', submissionId).single();
  if (fetchErr || !sub) { showToast('❌ Tidak jumpa permohonan.'); return; }

  const isJKM = sub.agency === 'JKM' || sub.category === 'JKM';
  const regBody = isJKM ? 'JKM (Jabatan Kebajikan Masyarakat)' : 'KPM (Kementerian Pendidikan Malaysia)';
  if(!confirm(`Sahkan: maklumat sekolah ini telah disemak dan disahkan benar berdaftar dengan ${regBody}?`)) return;

  try {

    const baseSlug = slugify(sub.school_name + '-' + (sub.district||sub.state||''));
    const uniqueSlug = `${baseSlug}-${sub.claim_code.toLowerCase().substring(0,4)}`;

    const isJKM = sub.agency === 'JKM' || sub.category === 'JKM';

    const { data: newSchool, error: insertErr } = await db.from('schools').insert({
      name: sub.school_name,
      category: sub.category || (isJKM ? 'JKM' : 'SWASTA'),
      agency: sub.agency || (isJKM ? 'JKM' : 'KPM'),
      school_code: isJKM ? null : sub.proposed_school_code,
      jkm_registration_no: isJKM ? (sub.jkm_registration_no || sub.proposed_school_code) : null,
      address: sub.address,
      district: sub.district,
      town: sub.town || sub.district,
      state: sub.state,
      postcode: sub.postcode,
      phone: sub.phone,
      whatsapp: sub.whatsapp,
      email: sub.email,
      contact_name: sub.contact_name,
      contact_phone: sub.contact_phone,
      slug: uniqueSlug,
      is_claimed: true,
      claim_status: 'approved',
      claim_code: sub.claim_code,
      is_active: true,
      is_verified: true,
    }).select().single();
    if (insertErr) throw insertErr;

    await db.from('new_school_submissions').update({
      status: 'approved',
      reviewed_at: new Date().toISOString(),
      created_school_id: newSchool.id,
    }).eq('id', submissionId);

    if (sub.email) {
      try {
        await fetch('/api/send-claim-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ to: sub.email, type: 'approved', schoolName: sub.school_name, claimCode: sub.claim_code })
        });
      } catch(e) { console.warn('Email send failed:', e); }
    }

    showToast('✅ Sekolah baharu dicipta & disahkan!');
    loadStats(); loadNewSchools();
  } catch(e) {
    showToast('❌ Ralat: ' + e.message);
  }
}

async function rejectNewSchool(submissionId) {
  if(!confirm('Tolak permohonan ini?')) return;
  const { error } = await db.from('new_school_submissions').update({ status: 'rejected', reviewed_at: new Date().toISOString() }).eq('id', submissionId);
  if (!error) { showToast('❌ Permohonan ditolak'); loadStats(); loadNewSchools(); }
  else { showToast('❌ Ralat'); }
}

async function approveClaim(submissionId, schoolId) {
  // Read the premium grant checkbox before anything else, since the
  // element gets removed once the list refreshes after this runs.
  const grantPremium = document.getElementById(`grantPremium-${submissionId}`)?.checked || false;

  // Pull the full submission AND the current school row, then merge —
  // any field the school left blank in this submission keeps its existing
  // value instead of being wiped out. Only fields the school actually
  // provided this time around overwrite what's there.
  const { data: subRows, error: fetchErr } = await db.rpc('get_claim_by_id', { p_id: submissionId });
  const sub = subRows?.[0];
  if (fetchErr || !sub) { showToast('Ralat: tidak dapat baca data tuntutan'); return; }

  const { data: current, error: currentErr } = await db.from('schools').select('*').eq('id', schoolId).single();
  if (currentErr || !current) { showToast('Ralat: tidak dapat baca data sekolah semasa'); return; }

  const merge = (field) => (sub[field] !== null && sub[field] !== undefined && sub[field] !== '') ? sub[field] : current[field];

  const { error: updateErr } = await db.rpc('approve_school_claim', {
    p_school_id: schoolId,
    p_fields: {
      phone:            merge('phone'),
      whatsapp:         merge('whatsapp'),
      email:            merge('email'),
      website:          merge('website'),
      description:      merge('description'),
      operating_hours:  merge('operating_hours'),
      age_range:        merge('age_range'),
      languages:        merge('languages'),
      curriculum:       merge('curriculum'),
      facebook_url:     merge('facebook_url'),
      instagram_url:    merge('instagram_url'),
      fee_min:          merge('fee_min'),
      fee_max:          merge('fee_max'),
      fee_source_url:   merge('fee_source_url'),
      fee_document_url: merge('fee_document_url'),
      contact_name:     merge('contact_name'),
      contact_phone:    merge('contact_phone'),
      claim_code:       sub.claim_code,
      plan:             sub.plan,
      is_premium:       grantPremium || current.is_premium || false,
    }
  });
  if (updateErr) { showToast('Ralat: ' + updateErr.message); return; }

  await db.rpc('update_claim_status', { p_id: submissionId, p_status: 'approved' });
  showToast(grantPremium ? '✅ Tuntutan diluluskan + Premium diberikan! 🎉' : '✅ Tuntutan diluluskan — maklumat kini di laman web!');

  // ── Notify school via email (approved) ──
  const notifyEmail = merge('email');
  if (notifyEmail) {
    try {
      await fetch('/api/send-claim-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          to: notifyEmail,
          type: 'approved',
          schoolName: current.name,
          claimCode: sub.claim_code,
          schoolId: schoolId
        })
      });
    } catch(e) { console.warn('Approval email notify failed:', e); }
  }
  loadStats(); loadClaims();
}

async function rejectClaim(submissionId, schoolId) {
  const { error } = await db.rpc('update_claim_status', { p_id: submissionId, p_status: 'rejected' });
  if(!error) {
    await db.rpc('reject_school_claim', { p_school_id: schoolId });
    showToast('❌ Tuntutan ditolak — tiada perubahan dibuat'); loadStats(); loadClaims();
  }
}

async function loadJobPostings() {
  document.getElementById('reviewsList').innerHTML = '<div class="spinner"></div>';
  try {
    const res = await fetch('/api/manage-job-posting', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action:'adminList', adminKey: ADMIN_API_KEY })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Ralat memuatkan.');
    const jobs = data.jobs || [];

    const pending = jobs.filter(j=>j.status==='pending');
    const active = jobs.filter(j=>j.status==='active');
    const others = jobs.filter(j=>!['pending','active'].includes(j.status));

    if(jobs.length===0){
      document.getElementById('reviewsList').innerHTML = '<div class="empty"><div class="empty-icon">💼</div><div>Tiada jawatan disiarkan lagi.</div></div>';
      return;
    }

    const fmt = d => d ? new Date(d).toLocaleDateString('ms-MY',{day:'numeric',month:'short',year:'numeric'}) : '–';
    const statusBadge = { pending:'badge-pending', active:'badge-approved', filled:'badge-approved', rejected:'badge-pending', expired:'badge-pending' };
    const statusText = { pending:'⏳ Menunggu', active:'✅ Aktif', filled:'🔒 Telah Diisi', rejected:'❌ Ditolak', expired:'⌛ Tamat Tempoh' };

    let html = '';

    if(pending.length){
      html += `<h3 style="font-size:14px;font-weight:900;margin-bottom:10px;">⏳ Menunggu Kelulusan (${pending.length})</h3>`;
      html += pending.map(j => `
        <div class="review-card" id="job-${j.id}">
          <div class="rc-head">
            <div class="rc-info">
              <div class="rc-name">${j.position}</div>
              <div class="rc-meta">🏫 ${j.school?.name||'–'} · 📍 ${j.school?.district||''}, ${j.school?.state||''}</div>
              <div class="rc-meta">${j.position_type||''} · ${j.num_openings||1} kekosongan ${(j.salary_min||j.salary_max)?`· 💰 RM${j.salary_min||'?'}–RM${j.salary_max||'?'}`:''}</div>
              <div class="rc-meta">Dihantar: ${fmt(j.created_at)} ${j.poster_url?`· <a href="${j.poster_url}" target="_blank">📎 Lihat poster</a>`:''}</div>
            </div>
            <span class="badge ${statusBadge[j.status]}">${statusText[j.status]}</span>
          </div>
          ${j.requirements ? `<div class="rc-comment">📋 ${j.requirements}</div>` : ''}
          <div class="rc-actions">
            <button class="btn btn-approve" onclick="approveJob('${j.id}')">✅ Luluskan</button>
            <button class="btn btn-reject" onclick="rejectJob('${j.id}')">❌ Tolak</button>
          </div>
        </div>`).join('');
    }

    if(active.length){
      html += `<h3 style="font-size:14px;font-weight:900;margin:20px 0 10px;">✅ Aktif (${active.length})</h3>`;
      html += active.map(j => {
        const daysLeft = j.expires_at ? Math.ceil((new Date(j.expires_at) - new Date())/86400000) : null;
        const expiryNote = daysLeft!==null ? (daysLeft>0 ? `⏳ Tamat dalam ${daysLeft} hari` : `⌛ Sudah lepas tempoh — perlu force expire`) : '';
        return `
        <div class="review-card" id="job-${j.id}">
          <div class="rc-head">
            <div class="rc-info">
              <div class="rc-name">${j.position}</div>
              <div class="rc-meta">🏫 ${j.school?.name||'–'} · 📍 ${j.school?.district||''}, ${j.school?.state||''}</div>
              <div class="rc-meta">${expiryNote}</div>
            </div>
            <span class="badge ${statusBadge[j.status]}">${statusText[j.status]}</span>
          </div>
          <div class="rc-actions">
            <button class="btn btn-delete" onclick="forceExpireJob('${j.id}')">⌛ Force Expire</button>
          </div>
        </div>`;
      }).join('');
    }

    if(others.length){
      html += `<h3 style="font-size:14px;font-weight:900;margin:20px 0 10px;">📁 Lain-lain (${others.length})</h3>`;
      html += others.map(j => `
        <div class="review-card" id="job-${j.id}" style="opacity:.7;">
          <div class="rc-head">
            <div class="rc-info">
              <div class="rc-name">${j.position}</div>
              <div class="rc-meta">🏫 ${j.school?.name||'–'}</div>
            </div>
            <span class="badge ${statusBadge[j.status]}">${statusText[j.status]}</span>
          </div>
          <div class="rc-actions" style="margin-top:8px;">
            <button class="btn btn-delete" style="font-size:12px;padding:6px 10px;" onclick="adminDeleteJob('${j.id}')">🗑️ Padam Kekal</button>
          </div>
        </div>`).join('');
    }

    document.getElementById('reviewsList').innerHTML = html;
  } catch(e) {
    document.getElementById('reviewsList').innerHTML = `<div class="empty">Ralat: ${e.message}</div>`;
  }
}

function onFeeLinkSearchInput() {
  clearTimeout(feeLinkSearchTimer);
  feeLinkSearchTimer = setTimeout(runFeeLinkSearch, 350);
}

async function runFeeLinkSearch() {
  const q = document.getElementById('feeLinkSearch').value.trim();
  const stateFilter = document.getElementById('feeLinkStateFilter').value;

  if (!q && !stateFilter) {
    document.getElementById('feeLinkResults').innerHTML = `
      <div class="empty"><div class="empty-icon">🔎</div><div>Taip nama sekolah, atau pilih negeri untuk lihat sekolah mengikut rating Google tertinggi</div></div>`;
    return;
  }
  document.getElementById('feeLinkResults').innerHTML = '<div class="spinner"></div>';

  let query = db.from('schools')
    .select('id,name,state,district,website,fee_source_url,fee_document_url,google_rating,google_reviews_count')
    .eq('category', 'ANTARABANGSA')
    .eq('has_website', true)
    .limit(q ? 25 : 200);

  if (q) {
    query = query.ilike('name', `%${q}%`);
  } else {
    // Browse mode: no name typed, just a state — show highest-rated first
    query = query.order('google_rating', { ascending: false, nullsFirst: false })
                 .order('google_reviews_count', { ascending: false, nullsFirst: false });
  }
  if (stateFilter) query = query.eq('state', stateFilter);

  const { data, error } = await query;
  if (error) {
    document.getElementById('feeLinkResults').innerHTML = `<div class="empty">Ralat: ${error.message}</div>`;
    return;
  }
  if (!data || data.length === 0) {
    document.getElementById('feeLinkResults').innerHTML = `
      <div class="empty"><div class="empty-icon">📭</div><div>Tiada sekolah antarabangsa berlaman web dijumpai${q ? ` untuk "${q}"` : ''}</div></div>`;
    return;
  }

  document.getElementById('feeLinkResults').innerHTML = data.map(s => `
    <div class="fee-card" id="fee-${s.id}">
      <div class="fee-card-name">${s.name} ${s.google_rating ? `<span style="color:var(--yellow);font-weight:800;font-size:12px;">⭐ ${s.google_rating} (${s.google_reviews_count||0})</span>` : ''}</div>
      <div class="fee-card-meta">📍 ${s.district||''}, ${s.state||''} · 🌐 <a href="${s.website}" target="_blank" rel="noopener">${s.website}</a></div>
      <div class="fee-input-row">
        <input type="url" id="feeUrlInput-${s.id}" placeholder="https://...halaman-yuran" value="${s.fee_source_url || ''}">
        <button class="fee-save-btn" onclick="saveFeeLink('${s.id}')">💾 Simpan</button>
      </div>
      <div style="margin-top:8px;">
        <input type="file" id="feeFileInput-${s.id}" accept=".pdf,.png,.jpg,.jpeg" style="font-size:12px;width:100%;">
        <div style="font-size:10px;color:var(--gray);font-weight:600;margin-top:3px;">Pilihan: muat naik PDF/screenshot jika tiada pautan terus ke halaman yuran</div>
      </div>
      <div class="fee-status ${(s.fee_source_url||s.fee_document_url) ? 'has-link' : 'no-link'}" id="feeStatus-${s.id}">
        ${s.fee_source_url ? '✅ Pautan sudah disimpan' : ''}${s.fee_source_url && s.fee_document_url ? ' · ' : ''}${s.fee_document_url ? `✅ Fail dimuat naik (<a href="${s.fee_document_url}" target="_blank" rel="noopener">lihat</a>)` : ''}${(!s.fee_source_url && !s.fee_document_url) ? '— Belum ada apa-apa' : ''}
      </div>
      ${s.fee_document_url ? `<button class="btn-delete" style="margin-top:6px;font-size:11px;padding:5px 12px;" onclick="deleteFeeDocument('${s.id}')">🗑️ Padam fail dimuat naik</button>` : ''}
    </div>`).join('');
}

async function deleteFeeDocument(id) {
  if (!confirm('Padam fail yuran yang dimuat naik untuk sekolah ini?')) return;
  const { error } = await db.rpc('admin_update_fee_document', { p_school_id: id, p_fee_document_url: null });
  if (error) { showToast('Ralat: ' + error.message); return; }
  showToast('🗑️ Fail dipadam');
  runFeeLinkSearch();
}

async function saveFeeLink(id) {
  const url = document.getElementById(`feeUrlInput-${id}`).value.trim() || null;
  const fileInput = document.getElementById(`feeFileInput-${id}`);
  const statusEl = document.getElementById(`feeStatus-${id}`);

  let fileUrl = undefined; // undefined = don't touch the column; null/string = update it
  if (fileInput.files && fileInput.files[0]) {
    const file = fileInput.files[0];
    const ext = file.name.split('.').pop().toLowerCase();
    const path = `${id}/admin-fee-document-${Date.now()}.${ext}`;
    const { error: uploadError } = await db.storage.from('school-assets').upload(path, file, { upsert: true });
    if (uploadError) {
      showToast('Ralat muat naik fail: ' + uploadError.message);
      return;
    }
    const { data: urlData } = db.storage.from('school-assets').getPublicUrl(path);
    fileUrl = urlData?.publicUrl || null;
  }

  const { error: sourceErr } = await db.rpc('admin_update_fee_source', { p_school_id: id, p_fee_source_url: url });
  if (sourceErr) { showToast('Ralat: ' + sourceErr.message); return; }
  if (fileUrl !== undefined) {
    const { error: docErr } = await db.rpc('admin_update_fee_document', { p_school_id: id, p_fee_document_url: fileUrl });
    if (docErr) { showToast('Ralat: ' + docErr.message); return; }
  }
  showToast('✅ Disimpan!');
  const hasLink = !!url;
  const hasFile = fileUrl !== undefined ? !!fileUrl : !!statusEl.querySelector('a');
  statusEl.className = `fee-status ${(hasLink||hasFile) ? 'has-link' : 'no-link'}`;
  statusEl.innerHTML = `${hasLink ? '✅ Pautan sudah disimpan' : ''}${hasLink && hasFile ? ' · ' : ''}${hasFile ? `✅ Fail dimuat naik (<a href="${fileUrl||'#'}" target="_blank" rel="noopener">lihat</a>)` : ''}${(!hasLink && !hasFile) ? '— Belum ada apa-apa' : ''}`;
}

async function runWebsiteSearch() {

  if (!q && !stateFilter) {

      <div class="empty"><div class="empty-icon">🔎</div><div>Taip nama sekolah, atau pilih negeri untuk mula</div></div>`;

  }
  document.getElementById('websiteResults').innerHTML = '<div class="spinner"></div>';

  let query = db.from('schools')
    .select('id,name,state,district,town,category,jkm_registration_no,website,fee_source_url,fee_document_url,google_rating,google_reviews_count')
    .eq('has_website', true)
    .limit(q ? 25 : 200);

  if (q) {
    query = query.ilike('name', `%${q}%`);
  } else {
    query = query.order('google_rating', { ascending: false, nullsFirst: false })
                 .order('google_reviews_count', { ascending: false, nullsFirst: false });
  }
  if (stateFilter) query = query.eq('state', stateFilter);

  const { data, error } = await query;

      </div>

        ${s.fee_source_url ? '✅ Pautan sudah disimpan' : ''}${s.fee_source_url && s.fee_document_url ? ' · ' : ''}${s.fee_document_url ? `✅ Fail dimuat naik (<a href="${s.fee_document_url}" target="_blank" rel="noopener">lihat</a>)` : ''}${(!s.fee_source_url && !s.fee_document_url) ? '— Belum ada apa-apa' : ''}
      </div>
    </div>`).join('');
}

async function saveWebsiteFeeLink(id) {
  const url = document.getElementById(`websiteFeeUrlInput-${id}`).value.trim() || null;
  const fileInput = document.getElementById(`websiteFeeFileInput-${id}`);
  const statusEl = document.getElementById(`websiteFeeStatus-${id}`);

  let fileUrl = undefined;
  if (fileInput.files && fileInput.files[0]) {
    const file = fileInput.files[0];
    const ext = file.name.split('.').pop().toLowerCase();
    const path = `${id}/admin-fee-document-${Date.now()}.${ext}`;
    const { error: uploadError } = await db.storage.from('school-assets').upload(path, file, { upsert: true });
    if (uploadError) {
      showToast('Ralat muat naik fail: ' + uploadError.message);
      return;
    }
    const { data: urlData } = db.storage.from('school-assets').getPublicUrl(path);
    fileUrl = urlData?.publicUrl || null;
  }

  const { error: sourceErr } = await db.rpc('admin_update_fee_source', { p_school_id: id, p_fee_source_url: url });
  if (sourceErr) { showToast('Ralat: ' + sourceErr.message); return; }
  if (fileUrl !== undefined) {
    const { error: docErr } = await db.rpc('admin_update_fee_document', { p_school_id: id, p_fee_document_url: fileUrl });
    if (docErr) { showToast('Ralat: ' + docErr.message); return; }
  }
  showToast('✅ Disimpan!');
  const hasLink = !!url;
  const hasFile = fileUrl !== undefined ? !!fileUrl : !!statusEl.querySelector('a');
  statusEl.className = `fee-status ${(hasLink||hasFile) ? 'has-link' : 'no-link'}`;
  statusEl.innerHTML = `${hasLink ? '✅ Pautan sudah disimpan' : ''}${hasLink && hasFile ? ' · ' : ''}${hasFile ? `✅ Fail dimuat naik (<a href="${fileUrl||'#'}" target="_blank" rel="noopener">lihat</a>)` : ''}${(!hasLink && !hasFile) ? '— Belum ada apa-apa' : ''}`;
}

// ── JKM DUAL-LICENSE REVIEW TOOL ──
// Reviews the 1,500 "needs_review" fuzzy-matched JKM<->KPM candidate
// pairs one by one. Each staging row was auto-matched by rapidfuzz
// during the original crawl but scored below the auto-accept threshold,
// so a human needs to confirm whether the JKM taska and the KPM school
// are genuinely the same operator (dual-licensed) or coincidentally
// similar (false match).
let jkmReviewQueue = [];
let jkmReviewIndex = 0;

async function loadJkmReviewTool() {
  document.getElementById('reviewsList').innerHTML = '<div class="spinner"></div>';
  try {
    const { data, error } = await db.rpc('get_jkm_review_queue', { p_limit: 500 });
    if (error) throw error;
    if (!data || data.length === 0) {
      document.getElementById('reviewsList').innerHTML = '<div class="empty"><div class="empty-icon">🎉</div><div>Semua rekod JKM telah disemak!</div></div>';
      return;
    }
    jkmReviewQueue = data;
    jkmReviewIndex = 0;
    renderJkmReviewCard();
  } catch(e) {
    document.getElementById('reviewsList').innerHTML = `<div class="empty">Ralat: ${e.message}</div>`;
  }
}

function renderJkmReviewCard() {
  const el = document.getElementById('reviewsList');
  if (jkmReviewIndex >= jkmReviewQueue.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">✅</div><div>Selesai untuk kelompok ini! ${jkmReviewQueue.length} rekod disemak.</div><button class="btn btn-approve" style="margin-top:12px;max-width:240px;" onclick="loadJkmReviewTool()">🔄 Muat Kelompok Seterusnya</button></div>`;
    return;
  }

  const r = jkmReviewQueue[jkmReviewIndex];
  const nameSimPct = Math.round((r.name_sim||0) * 100);
  const addrSimPct = Math.round((r.addr_sim||0) * 100);
  const nameColor = nameSimPct >= 90 ? 'var(--green)' : nameSimPct >= 60 ? 'var(--yellow)' : 'var(--red)';
  const addrColor = addrSimPct >= 75 ? 'var(--green)' : addrSimPct >= 40 ? 'var(--yellow)' : 'var(--red)';
  const isMultiBranch = (r.candidates_pointing_here || 1) > 1;

  el.innerHTML = `
    <div style="text-align:center;margin-bottom:14px;font-weight:800;color:var(--gray);font-size:13px;">
      Rekod ${jkmReviewIndex + 1} daripada ${jkmReviewQueue.length} (kelompok ini) · Baki keseluruhan dianggarkan ~${1492 - jkmReviewIndex}
    </div>
    <div style="display:flex;justify-content:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
      <span style="background:${nameColor};color:#fff;padding:4px 12px;border-radius:99px;font-weight:900;font-size:12px;">📛 Nama: ${nameSimPct}%</span>
      <span style="background:${addrColor};color:#fff;padding:4px 12px;border-radius:99px;font-weight:900;font-size:12px;">📍 Alamat: ${addrSimPct}%</span>
    </div>
    ${isMultiBranch ? `<div style="background:#FEF2F2;border:2px solid #FECACA;border-radius:10px;padding:10px 14px;margin-bottom:14px;text-align:center;font-weight:800;font-size:12px;color:var(--red);">⚠️ AMARAN: ${r.candidates_pointing_here} rekod JKM berbeza dipadankan ke sekolah KPM yang sama — mungkin jenama bercawangan. Semak dengan teliti sebelum sahkan.</div>` : ''}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;">
      <div class="review-card" style="background:#FFFBEB;border-color:#FDE68A;">
        <div style="font-weight:900;font-size:11px;color:var(--jkmd);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;">🧸 Data JKM (Sumber)</div>
        <div style="font-weight:900;font-size:15px;margin-bottom:6px;">${r.jkm_name}</div>
        <div class="rc-meta">📋 No. Pendaftaran: <code>${r.registration_no||'–'}</code></div>
        <div class="rc-meta">📍 ${r.jkm_address||''}</div>
        <div class="rc-meta">🗺️ ${r.district||''}, ${r.state||''} ${r.postcode||''}</div>
        <div class="rc-meta">📅 Sah: ${r.valid_from||'–'} → ${r.valid_to||'–'}</div>
      </div>
      <div class="review-card" style="background:#F0FDFA;border-color:#99F6E4;">
        <div style="font-weight:900;font-size:11px;color:var(--teal);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;">🏫 Calon KPM (Sepadan)</div>
        ${r.matched_school_id ? `
          <div style="font-weight:900;font-size:15px;margin-bottom:6px;">${r.kpm_name||''}</div>
          <div class="rc-meta">🏷️ ${r.kpm_category||''}</div>
          <div class="rc-meta">📍 ${r.kpm_address||''}</div>
          <div class="rc-meta">🗺️ ${r.kpm_district||''}, ${r.kpm_state||''}</div>
          <div class="rc-meta">📞 ${r.kpm_phone||'–'}</div>
        ` : '<div style="color:var(--red);font-weight:700;">⚠️ Calon tidak dijumpai</div>'}
      </div>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-approve" style="flex:1;" onclick="confirmJkmMatch('${r.id}')">✅ Sama — Sekolah Berlesen Dwi</button>
      <button class="btn btn-reject" style="flex:1;" onclick="rejectJkmMatch('${r.id}')">❌ Bukan Sama</button>
    </div>
    <div style="text-align:center;margin-top:10px;">
      <button onclick="skipJkmReview()" style="background:none;border:none;color:var(--gray);font-weight:700;font-size:12px;cursor:pointer;text-decoration:underline;">Langkau, semak kemudian →</button>
    </div>
  `;
}

async function confirmJkmMatch(stagingId) {
  const r = jkmReviewQueue.find(x => x.id === stagingId);
  if (!r || !r.matched_school_id) { showToast('❌ Ralat: data tidak lengkap.'); return; }
  try {
    const { error } = await db.rpc('confirm_jkm_dual_license', {
      p_staging_id: stagingId,
      p_matched_school_id: r.matched_school_id,
      p_live_school_id: r.live_school_id || null,
      p_registration_no: r.registration_no,
      p_registration_category: r.registration_category,
      p_valid_from: r.valid_from,
      p_valid_to: r.valid_to,
    });
    if (error) throw error;

    showToast('✅ Disahkan sebagai sekolah berlesen dwi!');
    jkmReviewIndex++;
    renderJkmReviewCard();
  } catch(e) {
    showToast('❌ Ralat: ' + e.message);
  }
}

async function rejectJkmMatch(stagingId) {
  try {
    // Leave the standalone JKM listing as-is (still active, correct as
    // a separate entity) -- just mark the staging match as rejected
    const { error } = await db.rpc('reject_jkm_match', { p_staging_id: stagingId });
    if (error) throw error;
    showToast('❌ Ditandakan sebagai bukan sepadan.');
    jkmReviewIndex++;
    renderJkmReviewCard();
  } catch(e) {
    showToast('❌ Ralat: ' + e.message);
  }
}

function skipJkmReview() {
  jkmReviewIndex++;

// ── GALLERY MODERATION TOOL ──
// Browse every uploaded school photo in one place, newest first, so
// Fadly can periodically check what's new without hunting through the
// raw Supabase Storage file list (unwieldy once there are hundreds of
// files across many schools). Not an approval gate -- photos go live
// immediately when a school uploads (same as before) -- this is purely
// for after-the-fact visibility and removal if something's inappropriate.
async function loadGalleryModerationTool() {
  document.getElementById('reviewsList').innerHTML = '<div class="spinner"></div>';
  try {
    const { data: photos, error } = await db.from('school_photos')
      .select('*')
      .order('created_at', { ascending: false })
      .limit(200);
    if (error) throw error;
    if (!photos || photos.length === 0) {
      document.getElementById('reviewsList').innerHTML = '<div class="empty"><div class="empty-icon">🖼️</div><div>Tiada gambar dimuat naik lagi.</div></div>';
      return;
    }

    const schoolIds = [...new Set(photos.map(p => p.school_id))];
    const { data: schoolsData } = await db.from('schools').select('id,name,town,state,category').in('id', schoolIds);
    const schoolMap = {};
    (schoolsData||[]).forEach(s => schoolMap[s.id] = s);

    const now = Date.now();
    const fmt = d => new Date(d).toLocaleDateString('ms-MY',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});

    document.getElementById('reviewsList').innerHTML = `
      <div style="text-align:center;margin-bottom:14px;font-weight:700;color:var(--gray);font-size:12px;">Menunjukkan ${photos.length} gambar terkini (semua sekolah) · 🆕 = dimuat naik dalam 48 jam lepas</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;">
        ${photos.map(p => {
          const school = schoolMap[p.school_id] || {};
          const isNew = (now - new Date(p.created_at).getTime()) < (48 * 60 * 60 * 1000);
          const isJKM = school.category === 'JKM';
          return `
          <div style="background:#fff;border:2px solid var(--border);border-radius:14px;overflow:hidden;position:relative;">
            ${isNew ? '<span style="position:absolute;top:6px;left:6px;background:#DC2626;color:#fff;font-size:9px;font-weight:900;padding:2px 8px;border-radius:8px;z-index:2;">🆕 BARU</span>' : ''}
            <img src="${p.photo_url}" style="width:100%;aspect-ratio:1;object-fit:cover;display:block;" loading="lazy">
            <div style="padding:8px;">
              <div style="font-size:11px;font-weight:800;line-height:1.3;margin-bottom:2px;">${isJKM?'🧸 ':''}${school.name||'(tidak dijumpai)'}</div>
              <div style="font-size:10px;color:var(--gray);font-weight:600;margin-bottom:4px;">${school.town||''}, ${school.state||''}</div>
              ${p.caption ? `<div style="font-size:10px;color:var(--teal);font-weight:700;margin-bottom:4px;">"${p.caption}"</div>` : ''}
              <div style="font-size:9px;color:var(--gray);margin-bottom:6px;">${fmt(p.created_at)}</div>
              <button onclick="deletePhotoAdmin('${p.id}', '${p.photo_url}')" style="width:100%;background:#FEE2E2;color:var(--red);border:none;padding:6px;border-radius:8px;font-weight:800;font-size:11px;cursor:pointer;">🗑️ Padam</button>
            </div>
          </div>`;
        }).join('')}
      </div>
    `;
  } catch(e) {
    document.getElementById('reviewsList').innerHTML = `<div class="empty">Ralat: ${e.message}</div>`;
  }
}

async function deletePhotoAdmin(photoId, photoUrl) {
  if (!confirm('Padam gambar ini secara kekal? Tindakan ini tidak boleh dibatalkan.')) return;
  try {
    // Extract the bucket-relative path from the full public URL, then
    // delete via the actual Storage API (not raw SQL -- Supabase blocks
    // direct SQL deletion of storage files for safety, this is the
    // correct sanctioned way to remove the real file, not just the DB row)
    const path = photoUrl.split('/school-assets/')[1];
    if (path) {
      const { error: storageErr } = await db.storage.from('school-assets').remove([path]);
      if (storageErr) console.warn('Storage delete warning (continuing to remove DB row anyway):', storageErr);
    }
    // Use the admin RPC, not a direct table delete -- this must work
    // regardless of the school's current claim status (admin oversight
    // shouldn't depend on that), unlike the school's own self-service delete.
    const { error } = await db.rpc('admin_delete_school_photo', { p_photo_id: photoId });
    if (error) throw error;
    showToast('🗑️ Gambar dipadam sepenuhnya');
    loadGalleryModerationTool();
  } catch(e) {
    showToast('❌ Ralat: ' + e.message);
  }
}
