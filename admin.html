<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — CariSchool</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--teal:#0D9488;--td:#0F766E;--yellow:#FBBF24;--dark:#1C1917;--gray:#78716C;--light:#F5F5F4;--border:#E7E5E4;--red:#EF4444;--green:#16A34A;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Nunito',sans-serif;background:var(--light);color:var(--dark);min-height:100vh;}

/* LOGIN */
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.login-box{background:#fff;border-radius:20px;padding:40px 32px;max-width:380px;width:100%;border:2px solid var(--border);box-shadow:4px 4px 0 var(--border);text-align:center;}
.login-logo{font-family:'Playfair Display',serif;font-size:28px;font-weight:900;color:var(--teal);margin-bottom:4px;}
.login-logo span{color:var(--yellow);}
.login-sub{font-size:13px;color:var(--gray);font-weight:600;margin-bottom:28px;}
.login-input{width:100%;padding:12px 16px;border:2px solid var(--border);border-radius:12px;font-size:15px;font-weight:700;font-family:'Nunito',sans-serif;outline:none;margin-bottom:12px;text-align:center;letter-spacing:3px;}
.login-input:focus{border-color:var(--teal);}
.login-btn{width:100%;background:var(--teal);color:#fff;border:none;padding:13px;border-radius:12px;font-weight:900;font-size:15px;cursor:pointer;font-family:'Nunito',sans-serif;box-shadow:3px 3px 0 var(--td);}
.login-err{color:var(--red);font-size:13px;font-weight:700;margin-top:8px;display:none;}

/* DASHBOARD */
#dashboard{display:none;padding:24px 20px;max-width:960px;margin:0 auto;}
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px;}
.top-logo{font-family:'Playfair Display',serif;font-size:22px;font-weight:900;color:var(--teal);}
.top-logo span{color:var(--yellow);}
.logout-btn{background:var(--light);border:2px solid var(--border);padding:7px 16px;border-radius:18px;font-weight:800;font-size:13px;cursor:pointer;font-family:'Nunito',sans-serif;}

/* TABS */
.tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:2px solid var(--border);padding-bottom:0;flex-wrap:wrap;}
.tab{padding:10px 20px;font-weight:800;font-size:14px;cursor:pointer;border-radius:12px 12px 0 0;border:2px solid transparent;border-bottom:none;margin-bottom:-2px;color:var(--gray);}
.tab.active{background:#fff;border-color:var(--border);color:var(--teal);}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:24px;}
.stat-box{background:#fff;border-radius:14px;border:2px solid var(--border);padding:16px;text-align:center;box-shadow:3px 3px 0 var(--border);}
.stat-n{font-family:'Playfair Display',serif;font-size:28px;font-weight:900;color:var(--teal);}
.stat-l{font-size:11px;color:var(--gray);font-weight:700;margin-top:3px;}

/* REVIEW CARDS */
.review-card{background:#fff;border-radius:16px;border:2px solid var(--border);padding:18px;margin-bottom:12px;box-shadow:3px 3px 0 var(--border);}
.rc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px;}
.rc-info{flex:1;}
.rc-name{font-weight:900;font-size:15px;}
.rc-meta{font-size:12px;color:var(--gray);font-weight:600;margin-top:2px;}
.rc-comment{font-size:14px;font-weight:600;line-height:1.6;color:var(--dark);background:var(--light);padding:10px 14px;border-radius:10px;margin-bottom:12px;}
.rc-actions{display:flex;gap:8px;flex-wrap:wrap;}
.btn{padding:7px 16px;border-radius:18px;font-weight:800;font-size:13px;cursor:pointer;font-family:'Nunito',sans-serif;border:none;transition:all .15s;}
.btn-approve{background:#DCFCE7;color:var(--green);}
.btn-approve:hover{background:var(--green);color:#fff;}
.btn-reject{background:#FEE2E2;color:var(--red);}
.btn-reject:hover{background:var(--red);color:#fff;}
.btn-delete{background:var(--light);color:var(--gray);border:2px solid var(--border);}
.badge{display:inline-block;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:800;}
.badge-pending{background:#FEF3C7;color:#92400E;}
.badge-approved{background:#DCFCE7;color:var(--green);}

.empty{text-align:center;padding:48px 20px;color:var(--gray);font-weight:700;}
.empty-icon{font-size:40px;margin-bottom:12px;}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;margin:40px auto;}
@keyframes spin{to{transform:rotate(360deg);}}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1C1917;color:#fff;padding:10px 22px;border-radius:18px;font-weight:800;font-size:14px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;}
.toast.show{opacity:1;}

/* FEE LINK TOOL */
.fee-search-bar{display:flex;gap:8px;margin-bottom:16px;}
.fee-search-bar input{flex:1;padding:11px 16px;border:2px solid var(--border);border-radius:12px;font-size:14px;font-weight:700;font-family:'Nunito',sans-serif;outline:none;}
.fee-search-bar input:focus{border-color:var(--teal);}
.fee-search-bar select{padding:11px 12px;border:2px solid var(--border);border-radius:12px;font-size:13px;font-weight:700;font-family:'Nunito',sans-serif;outline:none;background:#fff;}
.fee-card{background:#fff;border-radius:14px;border:2px solid var(--border);padding:14px 16px;margin-bottom:10px;box-shadow:3px 3px 0 var(--border);}
.fee-card-name{font-weight:900;font-size:14px;margin-bottom:2px;}
.fee-card-meta{font-size:11px;color:var(--gray);font-weight:600;margin-bottom:10px;}
.fee-input-row{display:flex;gap:8px;}
.fee-input-row input{flex:1;padding:9px 12px;border:2px solid var(--border);border-radius:10px;font-size:13px;font-family:'Nunito',sans-serif;outline:none;}
.fee-input-row input:focus{border-color:var(--teal);}
.fee-save-btn{background:var(--teal);color:#fff;border:none;padding:9px 16px;border-radius:10px;font-weight:800;font-size:12px;cursor:pointer;font-family:'Nunito',sans-serif;white-space:nowrap;}
.fee-status{font-size:11px;font-weight:700;margin-top:6px;}
.fee-status.has-link{color:var(--green);}
.fee-status.no-link{color:var(--gray);}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">Cari<span>School</span></div>
    <div class="login-sub">🔒 Admin Dashboard</div>
    <input type="password" id="pwdInput" class="login-input" placeholder="••••••••"
      onkeydown="if(event.key==='Enter')checkLogin()">
    <button class="login-btn" onclick="checkLogin()">Log Masuk →</button>
    <div class="login-err" id="loginErr">❌ Kata laluan salah</div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="top-bar">
    <div class="top-logo">Cari<span>School</span> <span style="font-size:14px;color:var(--gray);font-weight:700;">Admin</span></div>
    <button class="logout-btn" onclick="logout()">Log Keluar</button>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-box"><div class="stat-n" id="statClaims">–</div><div class="stat-l">Tuntutan Sekolah</div></div>
    <div class="stat-box"><div class="stat-n" id="statJobs">–</div><div class="stat-l">Jawatan Menunggu</div></div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" id="tabClaims"   onclick="switchTab('claims')">🏫 Tuntutan Sekolah</div>
    <div class="tab"        id="tabFeeLinks" onclick="switchTab('feelinks')">💰 Pautan Yuran</div>
    <div class="tab"        id="tabJobs"     onclick="switchTab('jobs')">💼 Jawatan Kosong</div>
    <div class="tab"        id="tabWebsites" onclick="switchTab('websites')">🌐 Sekolah Berlaman Web</div>
    <div class="tab"        id="tabEvents"   onclick="switchTab('events')">📅 Hari Terbuka</div>
    <div class="tab"        id="tabFacebook" onclick="switchTab('facebook')">📱 Halaman Facebook</div>
  </div>

  <div id="reviewsList"><div class="spinner"></div></div>
</div>

<div class="toast" id="toast"></div>

<script>
const ADMIN_PASSWORD = 'hayden111';
const ADMIN_API_KEY = 'hayden111'; // must match the ADMIN_API_KEY env var set in Vercel
const SB_URL = 'https://pwbuhlwxnnxvtbqehyvy.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3YnVobHd4bm54dnRicWVoeXZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNTc4MTIsImV4cCI6MjA5MzczMzgxMn0.jIPBjCIazqMw6F-luFEebNy_YV6V35f2-LlnN9SDGiQ';
const db = window.supabase.createClient(SB_URL, SB_KEY);

let currentTab = 'claims';

// ── AUTH ──
function checkLogin() {
  const pwd = document.getElementById('pwdInput').value;
  if(pwd === ADMIN_PASSWORD) {
    sessionStorage.setItem('cs_admin', '1');
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadDashboard();
  } else {
    document.getElementById('loginErr').style.display = 'block';
    document.getElementById('pwdInput').value = '';
  }
}
function logout() {
  sessionStorage.removeItem('cs_admin');
  location.reload();
}

// Auto-login if session exists
if(sessionStorage.getItem('cs_admin') === '1') {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadDashboard();
}

// ── LOAD ──
async function loadDashboard() {
  await Promise.all([loadStats(), loadClaims()]);
}

async function loadStats() {
  const [{ count: claims }] = await Promise.all([
    db.from('schools').select('*', { count:'exact', head:true }).eq('claim_status','pending'),
  ]);
  document.getElementById('statClaims').textContent   = claims   || 0;
  try {
    const res = await fetch('/api/manage-job-posting', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action:'adminList', adminKey: ADMIN_API_KEY })
    });
    const data = await res.json();
    const pendingCount = (data.jobs||[]).filter(j=>j.status==='pending').length;
    document.getElementById('statJobs').textContent = pendingCount;
  } catch(e){ document.getElementById('statJobs').textContent = '–'; }
}

// ── TABS ──
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tabClaims').classList.toggle('active',   tab === 'claims');
  document.getElementById('tabFeeLinks').classList.toggle('active', tab === 'feelinks');
  document.getElementById('tabJobs').classList.toggle('active', tab === 'jobs');
  document.getElementById('tabWebsites').classList.toggle('active', tab === 'websites');
  document.getElementById('tabEvents').classList.toggle('active', tab === 'events');
  document.getElementById('tabFacebook').classList.toggle('active', tab === 'facebook');
  if(tab === 'claims') loadClaims();
  else if(tab === 'feelinks') loadFeeLinksTool();
  else if(tab === 'jobs') loadJobPostings();
  else if(tab === 'websites') loadWebsiteTool();
  else if(tab === 'events') loadEventsTool();
  else if(tab === 'facebook') loadFacebookTool();
}

async function loadClaims() {
  document.getElementById('reviewsList').innerHTML = '<div class="spinner"></div>';
  const { data, error } = await db.from('claim_submissions')
    .select('*, schools(name,state,district,school_code)')
    .eq('status', 'pending')
    .order('created_at', { ascending: false });

  if (error) {
    document.getElementById('reviewsList').innerHTML = `<div class="empty">Ralat: ${error.message}</div>`;
    return;
  }
  if(!data || data.length === 0) {
    document.getElementById('reviewsList').innerHTML = '<div class="empty"><div class="empty-icon">🎉</div><div>Tiada tuntutan baharu!</div></div>';
    return;
  }
  const fmt = d => d ? new Date(d).toLocaleDateString('ms-MY',{day:'numeric',month:'long',year:'numeric'}) : '–';

  document.getElementById('reviewsList').innerHTML = data.map(s => `
    <div class="review-card" id="cl-${s.id}">
      <div class="rc-head">
        <div class="rc-info">
          <div class="rc-name">${s.schools?.name || '(sekolah tidak dijumpai)'}</div>
          <div class="rc-meta">📍 ${s.schools?.district||''}, ${s.schools?.state||''} · ${s.schools?.school_code||''}</div>
          <div class="rc-meta">👤 ${s.contact_name||'–'} · 📱 ${s.contact_phone||'–'}</div>
          <div class="rc-meta">📞 ${s.phone||'–'} · 💬 ${s.whatsapp||'–'} · 📧 ${s.email||'–'}</div>
          <div class="rc-meta">Pelan: <strong>${s.plan === 'premium_interest' ? '⭐ Premium (Berminat)' : 'Percuma'}</strong> · Kod: <code>${s.claim_code||'–'}</code> · Dihantar: ${fmt(s.created_at)}</div>
          ${(s.fee_min||s.fee_max) ? `<div class="rc-meta">💰 Yuran dicadang: RM${s.fee_min||'?'} – RM${s.fee_max||'?'}</div>` : ''}
          ${s.fee_source_url ? `<div class="rc-meta">🔗 Pautan yuran: <a href="${s.fee_source_url}" target="_blank" rel="noopener">${s.fee_source_url}</a></div>` : ''}
          ${s.fee_document_url ? `<div class="rc-meta">📎 Dokumen yuran: <a href="${s.fee_document_url}" target="_blank" rel="noopener">Lihat fail</a></div>` : ''}
          <div class="rc-meta">📜 Sijil SSM/MOE: ${s.proof_document_url ? `<a href="${s.proof_document_url}" target="_blank" rel="noopener" style="color:var(--green);font-weight:800;">✓ Lihat sijil</a>` : '<span style="color:var(--red);font-weight:800;">⚠️ Tiada sijil dimuat naik</span>'}</div>
        </div>
        <span class="badge badge-pending">⏳ Menunggu</span>
      </div>
      ${s.website ? `<div class="rc-comment">🌐 ${s.website}</div>` : ''}
      ${s.description ? `<div class="rc-comment">📝 ${s.description}</div>` : ''}
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#92400E;background:#FEF3C7;padding:8px 12px;border-radius:10px;margin-bottom:10px;cursor:pointer;">
        <input type="checkbox" id="grantPremium-${s.id}" style="width:16px;height:16px;">
        ⭐ Berikan Premium Percuma (founding member)
      </label>
      <div class="rc-actions">
        <button class="btn btn-approve" onclick="approveClaim('${s.id}','${s.school_id}')">✅ Luluskan</button>
        <button class="btn btn-reject"  onclick="rejectClaim('${s.id}','${s.school_id}')">❌ Tolak</button>
      </div>
    </div>`).join('');
}

async function approveClaim(submissionId, schoolId) {
  // Read the premium grant checkbox before anything else, since the
  // element gets removed once the list refreshes after this runs.
  const grantPremium = document.getElementById(`grantPremium-${submissionId}`)?.checked || false;

  // Pull the full submission AND the current school row, then merge —
  // any field the school left blank in this submission keeps its existing
  // value instead of being wiped out. Only fields the school actually
  // provided this time around overwrite what's there.
  const { data: sub, error: fetchErr } = await db.from('claim_submissions').select('*').eq('id', submissionId).single();
  if (fetchErr || !sub) { showToast('Ralat: tidak dapat baca data tuntutan'); return; }

  const { data: current, error: currentErr } = await db.from('schools').select('*').eq('id', schoolId).single();
  if (currentErr || !current) { showToast('Ralat: tidak dapat baca data sekolah semasa'); return; }

  const merge = (field) => (sub[field] !== null && sub[field] !== undefined && sub[field] !== '') ? sub[field] : current[field];

  const { error: updateErr } = await db.from('schools').update({
    phone:            merge('phone'),
    whatsapp:         merge('whatsapp'),
    email:            merge('email'),
    website:          merge('website'),
    description:      merge('description'),
    operating_hours:  merge('operating_hours'),
    age_range:        merge('age_range'),
    languages:        merge('languages'),
    curriculum:       merge('curriculum'),
    facebook_url:     merge('facebook_url'),
    instagram_url:    merge('instagram_url'),
    fee_min:          merge('fee_min'),
    fee_max:          merge('fee_max'),
    fee_source_url:   merge('fee_source_url'),
    fee_document_url: merge('fee_document_url'),
    contact_name:     merge('contact_name'),
    contact_phone:    merge('contact_phone'),
    claim_code:       sub.claim_code,
    plan:             sub.plan,
    is_premium:       grantPremium || current.is_premium || false,
    claim_status:     'claimed',
    is_claimed:       true,
    updated_at:       new Date().toISOString()
  }).eq('id', schoolId);
  if (updateErr) { showToast('Ralat: ' + updateErr.message); return; }

  await db.from('claim_submissions').update({ status: 'approved', reviewed_at: new Date().toISOString() }).eq('id', submissionId);
  showToast(grantPremium ? '✅ Tuntutan diluluskan + Premium diberikan! 🎉' : '✅ Tuntutan diluluskan — maklumat kini di laman web!');

  // ── Notify school via email (approved) ──
  const notifyEmail = merge('email');
  if (notifyEmail) {
    try {
      await fetch('/api/send-claim-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          to: notifyEmail,
          type: 'approved',
          schoolName: current.name,
          claimCode: sub.claim_code
        })
      });
    } catch(e) { console.warn('Approval email notify failed:', e); }
  }
  loadStats(); loadClaims();
}

async function rejectClaim(submissionId, schoolId) {
  const { error } = await db.from('claim_submissions').update({ status: 'rejected', reviewed_at: new Date().toISOString() }).eq('id', submissionId);
  if(!error) {
    await db.from('schools').update({ claim_status: 'rejected' }).eq('id', schoolId);
    showToast('❌ Tuntutan ditolak — tiada perubahan dibuat'); loadStats(); loadClaims();
  }
}

// ── JOB POSTINGS TOOL ──
async function loadJobPostings() {
  document.getElementById('reviewsList').innerHTML = '<div class="spinner"></div>';
  try {
    const res = await fetch('/api/manage-job-posting', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action:'adminList', adminKey: ADMIN_API_KEY })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Ralat memuatkan.');
    const jobs = data.jobs || [];

    const pending = jobs.filter(j=>j.status==='pending');
    const active = jobs.filter(j=>j.status==='active');
    const others = jobs.filter(j=>!['pending','active'].includes(j.status));

    if(jobs.length===0){
      document.getElementById('reviewsList').innerHTML = '<div class="empty"><div class="empty-icon">💼</div><div>Tiada jawatan disiarkan lagi.</div></div>';
      return;
    }

    const fmt = d => d ? new Date(d).toLocaleDateString('ms-MY',{day:'numeric',month:'short',year:'numeric'}) : '–';
    const statusBadge = { pending:'badge-pending', active:'badge-approved', filled:'badge-approved', rejected:'badge-pending', expired:'badge-pending' };
    const statusText = { pending:'⏳ Menunggu', active:'✅ Aktif', filled:'🔒 Telah Diisi', rejected:'❌ Ditolak', expired:'⌛ Tamat Tempoh' };

    let html = '';

    if(pending.length){
      html += `<h3 style="font-size:14px;font-weight:900;margin-bottom:10px;">⏳ Menunggu Kelulusan (${pending.length})</h3>`;
      html += pending.map(j => `
        <div class="review-card" id="job-${j.id}">
          <div class="rc-head">
            <div class="rc-info">
              <div class="rc-name">${j.position}</div>
              <div class="rc-meta">🏫 ${j.school?.name||'–'} · 📍 ${j.school?.district||''}, ${j.school?.state||''}</div>
              <div class="rc-meta">${j.position_type||''} · ${j.num_openings||1} kekosongan ${(j.salary_min||j.salary_max)?`· 💰 RM${j.salary_min||'?'}–RM${j.salary_max||'?'}`:''}</div>
              <div class="rc-meta">Dihantar: ${fmt(j.created_at)} ${j.poster_url?`· <a href="${j.poster_url}" target="_blank">📎 Lihat poster</a>`:''}</div>
            </div>
            <span class="badge ${statusBadge[j.status]}">${statusText[j.status]}</span>
          </div>
          ${j.requirements ? `<div class="rc-comment">📋 ${j.requirements}</div>` : ''}
          <div class="rc-actions">
            <button class="btn btn-approve" onclick="approveJob('${j.id}')">✅ Luluskan</button>
            <button class="btn btn-reject" onclick="rejectJob('${j.id}')">❌ Tolak</button>
          </div>
        </div>`).join('');
    }

    if(active.length){
      html += `<h3 style="font-size:14px;font-weight:900;margin:20px 0 10px;">✅ Aktif (${active.length})</h3>`;
      html += active.map(j => {
        const daysLeft = j.expires_at ? Math.ceil((new Date(j.expires_at) - new Date())/86400000) : null;
        const expiryNote = daysLeft!==null ? (daysLeft>0 ? `⏳ Tamat dalam ${daysLeft} hari` : `⌛ Sudah lepas tempoh — perlu force expire`) : '';
        return `
        <div class="review-card" id="job-${j.id}">
          <div class="rc-head">
            <div class="rc-info">
              <div class="rc-name">${j.position}</div>
              <div class="rc-meta">🏫 ${j.school?.name||'–'} · 📍 ${j.school?.district||''}, ${j.school?.state||''}</div>
              <div class="rc-meta">${expiryNote}</div>
            </div>
            <span class="badge ${statusBadge[j.status]}">${statusText[j.status]}</span>
          </div>
          <div class="rc-actions">
            <button class="btn btn-delete" onclick="forceExpireJob('${j.id}')">⌛ Force Expire</button>
          </div>
        </div>`;
      }).join('');
    }

    if(others.length){
      html += `<h3 style="font-size:14px;font-weight:900;margin:20px 0 10px;">📁 Lain-lain (${others.length})</h3>`;
      html += others.map(j => `
        <div class="review-card" id="job-${j.id}" style="opacity:.7;">
          <div class="rc-head">
            <div class="rc-info">

function onFeeLinkSearchInput() {

async function runFeeLinkSearch() {
  const q = document.getElementById('feeLinkSearch').value.trim();
  const stateFilter = document.getElementById('feeLinkStateFilter').value;

  if (!q && !stateFilter) {
    document.getElementById('feeLinkResults').innerHTML = `
      <div class="empty"><div class="empty-icon">🔎</div><div>Taip nama sekolah, atau pilih negeri untuk lihat sekolah mengikut rating Google tertinggi</div></div>`;
    return;
  }
  document.getElementById('feeLinkResults').innerHTML = '<div class="spinner"></div>';

  let query = db.from('schools')
    .select('id,name,state,district,website,fee_source_url,fee_document_url,google_rating,google_reviews_count')
    .eq('category', 'ANTARABANGSA')
    .eq('has_website', true)
    .limit(q ? 25 : 200);

  if (q) {
    query = query.ilike('name', `%${q}%`);
  } else {
    // Browse mode: no name typed, just a state — show highest-rated first
    query = query.order('google_rating', { ascending: false, nullsFirst: false })
                 .order('google_reviews_count', { ascending: false, nullsFirst: false });
  }
  if (stateFilter) query = query.eq('state', stateFilter);

  const { data, error } = await query;
  if (error) {
    document.getElementById('feeLinkResults').innerHTML = `<div class="empty">Ralat: ${error.message}</div>`;
    return;
  }
  if (!data || data.length === 0) {
    document.getElementById('feeLinkResults').innerHTML = `
      <div class="empty"><div class="empty-icon">📭</div><div>Tiada sekolah antarabangsa berlaman web dijumpai${q ? ` untuk "${q}"` : ''}</div></div>`;
    return;
  }

  document.getElementById('feeLinkResults').innerHTML = data.map(s => `
    <div class="fee-card" id="fee-${s.id}">
      <div class="fee-card-name">${s.name} ${s.google_rating ? `<span style="color:var(--yellow);font-weight:800;font-size:12px;">⭐ ${s.google_rating} (${s.google_reviews_count||0})</span>` : ''}</div>
      <div class="fee-card-meta">📍 ${s.district||''}, ${s.state||''} · 🌐 <a href="${s.website}" target="_blank" rel="noopener">${s.website}</a></div>
      <div class="fee-input-row">
        <input type="url" id="feeUrlInput-${s.id}" placeholder="https://...halaman-yuran" value="${s.fee_source_url || ''}">
        <button class="fee-save-btn" onclick="saveFeeLink('${s.id}')">💾 Simpan</button>
      </div>
      <div style="margin-top:8px;">
        <input type="file" id="feeFileInput-${s.id}" accept=".pdf,.png,.jpg,.jpeg" style="font-size:12px;width:100%;">
        <div style="font-size:10px;color:var(--gray);font-weight:600;margin-top:3px;">Pilihan: muat naik PDF/screenshot jika tiada pautan terus ke halaman yuran</div>
      </div>
      <div class="fee-status ${(s.fee_source_url||s.fee_document_url) ? 'has-link' : 'no-link'}" id="feeStatus-${s.id}">
        ${s.fee_source_url ? '✅ Pautan sudah disimpan' : ''}${s.fee_source_url && s.fee_document_url ? ' · ' : ''}${s.fee_document_url ? `✅ Fail dimuat naik (<a href="${s.fee_document_url}" target="_blank" rel="noopener">lihat</a>)` : ''}${(!s.fee_source_url && !s.fee_document_url) ? '— Belum ada apa-apa' : ''}
      </div>
      ${s.fee_document_url ? `<button class="btn-delete" style="margin-top:6px;font-size:11px;padding:5px 12px;" onclick="deleteFeeDocument('${s.id}')">🗑️ Padam fail dimuat naik</button>` : ''}
    </div>`).join('');
}

async function deleteFeeDocument(id) {
  if (!confirm('Padam fail yuran yang dimuat naik untuk sekolah ini?')) return;
  const { error } = await db.from('schools').update({ fee_document_url: null }).eq('id', id);
  if (error) { showToast('Ralat: ' + error.message); return; }
  showToast('🗑️ Fail dipadam');
  runFeeLinkSearch();
}

async function saveFeeLink(id) {
  const url = document.getElementById(`feeUrlInput-${id}`).value.trim() || null;
  const fileInput = document.getElementById(`feeFileInput-${id}`);
  const statusEl = document.getElementById(`feeStatus-${id}`);

  let fileUrl = undefined; // undefined = don't touch the column; null/string = update it
  if (fileInput.files && fileInput.files[0]) {
    const file = fileInput.files[0];
    const ext = file.name.split('.').pop().toLowerCase();
    const path = `${id}/admin-fee-document-${Date.now()}.${ext}`;
    const { error: uploadError } = await db.storage.from('school-assets').upload(path, file, { upsert: true });
    if (uploadError) {
      showToast('Ralat muat naik fail: ' + uploadError.message);
      return;
    }
    const { data: urlData } = db.storage.from('school-assets').getPublicUrl(path);
    fileUrl = urlData?.publicUrl || null;
  }

  const updatePayload = { fee_source_url: url };
  if (fileUrl !== undefined) updatePayload.fee_document_url = fileUrl;

  const { error } = await db.from('schools').update(updatePayload).eq('id', id);
  if (error) {
    showToast('Ralat: ' + error.message);
    return;
  }
  showToast('✅ Disimpan!');
  const hasLink = !!url;
  const hasFile = fileUrl !== undefined ? !!fileUrl : !!statusEl.querySelector('a');
  statusEl.className = `fee-status ${(hasLink||hasFile) ? 'has-link' : 'no-link'}`;
  statusEl.innerHTML = `${hasLink ? '✅ Pautan sudah disimpan' : ''}${hasLink && hasFile ? ' · ' : ''}${hasFile ? `✅ Fail dimuat naik (<a href="${fileUrl||'#'}" target="_blank" rel="noopener">lihat</a>)` : ''}${(!hasLink && !hasFile) ? '— Belum ada apa-apa' : ''}`;
}

async function runEventSchoolSearch() {

  if (q.length < 3) { box.innerHTML = ''; return; }
  box.innerHTML = '<div class="spinner"></div>';

  if (!data || data.length === 0) {

  document.getElementById('eventSearchResults').innerHTML = '';
  document.getElementById('eventSchoolSearch').value = s.name;
  document.getElementById('eventSchoolName').textContent = `📌 ${s.name}`;
  document.getElementById('eventAddForm').style.display = 'block';
}

async function addEvent() {
  const name = document.getElementById('eventName').value.trim();
  const date = document.getElementById('eventDate').value;
  const desc = document.getElementById('eventDesc').value.trim() || null;
  if (!eventSelectedSchool) { showToast('Sila pilih sekolah dahulu'); return; }
  if (!name || !date) { showToast('Sila isikan nama acara dan tarikh'); return; }

  let bannerUrl = null;
  const bannerInput = document.getElementById('eventBanner');
  if (bannerInput.files && bannerInput.files[0]) {
    const file = bannerInput.files[0];
    const ext = file.name.split('.').pop().toLowerCase();
    const path = `${eventSelectedSchool.id}/event-banner-${Date.now()}.${ext}`;
    const { error: uploadError } = await db.storage.from('school-assets').upload(path, file, { upsert: true });
    if (uploadError) {
      showToast('Ralat muat naik gambar: ' + uploadError.message);
      return;
    }
    const { data: urlData } = db.storage.from('school-assets').getPublicUrl(path);
    bannerUrl = urlData?.publicUrl || null;
  }

  const { error } = await db.from('school_events').insert({
    school_id: eventSelectedSchool.id,
    event_name: name,
    event_date: date,
    description: desc,
    banner_url: bannerUrl
  });
  if (error) { showToast('Ralat: ' + error.message); return; }
  showToast('✅ Acara ditambah!');
  document.getElementById('eventName').value = '';
  document.getElementById('eventDate').value = '';
  document.getElementById('eventDesc').value = '';
  document.getElementById('eventBanner').value = '';
  loadUpcomingEvents();
}

async function loadUpcomingEvents() {
  const today = new Date().toISOString().split('T')[0];
  const { data, error } = await db.from('school_events')
    .select('*, schools(name,state,district)')
    .gte('event_date', today)
    .order('event_date', { ascending: true });

  const el = document.getElementById('upcomingEventsList');
  if (error) { el.innerHTML = `<div class="empty">Ralat: ${error.message}</div>`; return; }
  if (!data || data.length === 0) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">📅</div><div>Tiada acara akan datang lagi</div></div>';
    return;
  }
  const fmt = d => new Date(d).toLocaleDateString('ms-MY', { day:'numeric', month:'long', year:'numeric' });
  el.innerHTML = data.map(e => `
    <div class="fee-card">
      <div class="fee-card-name">${e.event_name}</div>
      <div class="fee-card-meta">🏫 ${e.schools?.name||'(sekolah tidak dijumpai)'} · 📍 ${e.schools?.district||''}, ${e.schools?.state||''}</div>
      <div class="fee-card-meta">📅 <strong>${fmt(e.event_date)}</strong></div>
      ${e.description ? `<div style="font-size:12px;color:var(--gray);font-weight:600;margin-top:6px;">${e.description}</div>` : ''}
      ${e.banner_url ? `<div style="margin-top:8px;"><img src="${e.banner_url}" alt="Banner" style="max-width:200px;border-radius:8px;border:2px solid var(--border);"></div>` : ''}
      <button class="btn btn-reject" style="margin-top:8px;font-size:11px;padding:5px 12px;" onclick="deleteEvent('${e.id}')">🗑️ Padam</button>
    </div>`).join('');
}

async function deleteEvent(id) {
  if (!confirm('Padam acara ini?')) return;
  const { error } = await db.from('school_events').delete().eq('id', id);
  if (!error) { showToast('🗑️ Acara dipadam'); loadUpcomingEvents(); }
  else showToast('Ralat: ' + error.message);
}

        <option value="KELANTAN">Kelantan</option>
        <option value="TERENGGANU">Terengganu</option>
        <option value="SABAH">Sabah</option>
        <option value="SARAWAK">Sarawak</option>
        <option value="PERLIS">Perlis</option>
        <option value="WP PUTRAJAYA">WP Putrajaya</option>
        <option value="WP LABUAN">WP Labuan</option>
      </select>
    </div>
    <div id="fbResults">
      <div class="empty"><div class="empty-icon">🔎</div><div>Taip nama sekolah, atau pilih negeri untuk lihat sekolah dengan halaman Facebook</div></div>
    </div>`;
}

function onFbSearchInput() {
  clearTimeout(fbSearchTimer);
  fbSearchTimer = setTimeout(runFbSearch, 350);
}

async function runFbSearch() {
  const q = document.getElementById('fbSearch').value.trim();
  const stateFilter = document.getElementById('fbStateFilter').value;

  if (!q && !stateFilter) {
    document.getElementById('fbResults').innerHTML = `
      <div class="empty"><div class="empty-icon">🔎</div><div>Taip nama sekolah, atau pilih negeri untuk mula</div></div>`;
    return;
  }
  document.getElementById('fbResults').innerHTML = '<div class="spinner"></div>';

  let query = db.from('schools')
    .select('id,name,state,district,facebook_url,google_rating,google_reviews_count')
    .not('facebook_url', 'is', null)
    .limit(q ? 25 : 200);

  if (q) {
    query = query.ilike('name', `%${q}%`);
  } else {
    query = query.order('google_rating', { ascending: false, nullsFirst: false })
                 .order('google_reviews_count', { ascending: false, nullsFirst: false });
  }
  if (stateFilter) query = query.eq('state', stateFilter);

  const { data, error } = await query;
  if (error) {
    document.getElementById('fbResults').innerHTML = `<div class="empty">Ralat: ${error.message}</div>`;
    return;
  }
  if (!data || data.length === 0) {
    document.getElementById('fbResults').innerHTML = `
      <div class="empty"><div class="empty-icon">📭</div><div>Tiada sekolah dengan halaman Facebook dijumpai${q ? ` untuk "${q}"` : ''}</div></div>`;
    return;
  }

  document.getElementById('fbResults').innerHTML = data.map(s => `
    <div class="fee-card">
      <div class="fee-card-name">${s.name} ${s.google_rating ? `<span style="color:var(--yellow);font-weight:800;font-size:12px;">⭐ ${s.google_rating} (${s.google_reviews_count||0})</span>` : ''}</div>
      <div class="fee-card-meta">📍 ${s.district||''}, ${s.state||''}</div>
      <a href="${s.facebook_url}" target="_blank" rel="noopener" class="fee-save-btn" style="display:inline-block;text-decoration:none;margin-top:8px;">📱 Buka Facebook</a>
    </div>`).join('');
}

// ── TOAST ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
